<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>华夏朝代脉络 · 秦 → 今</title>
<style>
:root{
  --zhu:#a8322a; --zhu-deep:#7d1f1a; --zhu-l:#c0504a;
  --gold:#c9a227; --gold-l:#e6c665; --gold-pale:#f0dfa8;
  --paper:#f7f1e2; --paper-2:#efe5cf; --card:#fffdf6;
  --ink:#2b2320; --ink-l:#6b5d50; --ink-xl:#9a8d7d;
  --qing:#3a6b6b; --line:#e2d6bd;
  --shadow:0 6px 22px rgba(90,50,20,.10);
  --topbar: 90px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(circle at 12% 6%, rgba(201,162,39,.07), transparent 42%),
    radial-gradient(circle at 88% 3%, rgba(168,50,42,.06), transparent 40%),
    repeating-linear-gradient(0deg, rgba(120,80,40,.018) 0 2px, transparent 2px 4px),var(--paper);
  color:var(--ink);line-height:1.6;min-height:100vh;padding-bottom:40px}
.wrap{max-width:820px;margin:0 auto}

.header{position:relative;overflow:hidden;text-align:center;padding:32px 20px 24px;
  background:linear-gradient(150deg,#6e1a16 0%, #9c2d26 46%, #b8443a 100%);color:var(--gold-pale);border-bottom:3px solid var(--gold)}
.header .clouds{position:absolute;inset:0;opacity:.16;pointer-events:none}
.header .seal{width:54px;height:54px;margin:0 auto 8px;border-radius:11px;
  background:linear-gradient(150deg,#d8453b,#a8322a);border:2px solid var(--gold-l);
  display:flex;align-items:center;justify-content:center;font-family:"Songti SC","SimSun",serif;font-weight:700;font-size:27px;color:#ffe9c2;
  box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,225,160,.25)}
.header h1{font-family:"Songti SC","SimSun",serif;font-weight:700;font-size:clamp(23px,6.2vw,38px);letter-spacing:2px;color:#f6e3ad;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.header .sub{margin-top:5px;font-size:clamp(11.5px,3.2vw,14px);color:#e9cf9a;letter-spacing:1px}

/* sticky topbar: 2 rows */
.topbar{position:sticky;top:0;z-index:60;background:rgba(247,241,226,.97);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(120,80,40,.06)}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:8px 12px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;font-family:inherit;font-size:13px;font-weight:600;color:var(--zhu-deep);
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:5px 13px;white-space:nowrap;cursor:pointer;transition:.18s}
.tabs button.active{background:linear-gradient(145deg,var(--zhu),var(--zhu-deep));color:var(--gold-l);border-color:var(--zhu-deep);box-shadow:0 3px 10px rgba(125,31,26,.35)}
.tabs button.ov{color:var(--qing);border-color:#bcd4d2}
.tabs button.ov.active{background:linear-gradient(145deg,#3a6b6b,#28504f);color:#dfeeed}

/* subnav: period jump chips */
.subnav{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none;border-top:1px solid rgba(226,214,189,.7);padding-top:7px}
.subnav::-webkit-scrollbar{display:none}
.subnav.hide{display:none}
.subnav button{flex:0 0 auto;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--ink-l);
  background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:4px 11px;white-space:nowrap;cursor:pointer;transition:.18s}
.subnav button .sn{color:var(--zhu);font-weight:700;margin-right:3px}
.subnav button.active{background:linear-gradient(145deg,var(--gold),#b8912a);color:#3a2600;border-color:#b8912a;box-shadow:0 2px 8px rgba(201,162,39,.4)}
.subnav button.active .sn{color:#5a3a00}

.panel{padding:6px 16px 20px;display:none}
.panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.dynhead{margin:14px 0 6px;padding:15px 18px;border-radius:14px;color:#fff;
  background:linear-gradient(135deg,#7d1f1a,#a8322a 60%,#b8443a);box-shadow:var(--shadow);position:relative;overflow:hidden}
.dynhead .dname{font-family:"Songti SC",serif;font-size:25px;font-weight:700;color:var(--gold-l);letter-spacing:2px}
.dynhead .dmeta{margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:#f0dcb0}
.dynhead .dmeta b{color:#fff;font-weight:600}
.dynhead .dov{margin-top:8px;font-size:12.8px;color:#f3e2bd;line-height:1.55;border-top:1px solid rgba(240,220,160,.22);padding-top:7px}

.era{position:relative;z-index:2;margin:22px 0 12px -16px;padding:11px 18px 11px 22px;border-radius:0 40px 40px 0;
  background:linear-gradient(100deg,#7d1f1a,#a8322a);color:#ffe9c2;box-shadow:var(--shadow);border-left:6px solid var(--gold);
  scroll-margin-top:var(--topbar)}
.era .eno{font-family:"Songti SC",serif;font-size:20px;font-weight:700;color:var(--gold-l);margin-right:9px}
.era .ename{font-family:"Songti SC",serif;font-size:16px;font-weight:700;letter-spacing:1px}
.era .esub{display:block;font-size:11px;color:#dfc08f;margin-top:2px}

.tl{position:relative;padding:2px 0 4px}
.tl::before{content:"";position:absolute;left:18px;top:8px;bottom:10px;width:3px;
  background:linear-gradient(var(--gold-l),var(--zhu) 70%,var(--zhu-deep));border-radius:3px;opacity:.5}
.card{position:relative;z-index:1;margin:0 0 8px 44px;background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:13px 15px;box-shadow:var(--shadow)}
.card::before{content:attr(data-n);position:absolute;left:-38px;top:14px;width:30px;height:30px;border-radius:50%;
  background:linear-gradient(145deg,var(--zhu),var(--zhu-deep));color:var(--gold-l);font-family:"Songti SC",serif;font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--gold-l);box-shadow:0 2px 8px rgba(125,31,26,.4)}
.card .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .name{font-family:"Songti SC","SimSun",serif;font-size:17.5px;font-weight:700;color:var(--zhu-deep);letter-spacing:.5px}
.card .temple{font-size:11px;color:#fff;background:var(--zhu);border-radius:5px;padding:1px 6px;font-weight:600}
.card .years{font-size:12px;color:var(--gold);font-weight:700;margin-left:auto;white-space:nowrap}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 6px}
.card .tag{font-size:10.5px;color:var(--ink-l);background:var(--paper-2);border-radius:20px;padding:1px 8px}
.card ul{list-style:none;margin-top:2px}
.card li{position:relative;font-size:13px;color:var(--ink);padding-left:14px;margin:3px 0;line-height:1.55}
.card li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.card li b{color:var(--zhu-deep);font-weight:600}
.card.tp{border-color:#e7b98f;box-shadow:0 6px 22px rgba(200,90,30,.16),0 0 0 2px rgba(201,162,39,.18)}
.card.tp::before{background:linear-gradient(145deg,#d98b2b,#b8641a)}
.card .tpflag{display:inline-block;font-size:10.5px;font-weight:700;color:#7d3a00;background:linear-gradient(90deg,#f4d27a,#e9b949);border-radius:5px;padding:1px 8px;margin-bottom:6px}

.conn{margin:0 0 8px 44px;position:relative;height:30px;display:flex;align-items:center}
.conn::before{content:"";position:absolute;left:-20px;top:50%;width:14px;height:2px;background:var(--gold);opacity:.6}
.conn span{font-size:11px;border-radius:20px;padding:2px 11px;font-weight:600;background:#fff;border:1px solid var(--line);color:var(--ink-l)}
.conn.usurp span,.conn.war span{color:var(--zhu);border-color:#e4b7b3;background:#fdf3f2}
.conn.branch span,.conn.sib span{color:var(--qing);border-color:#b6d0cf;background:#f0f7f6}
.conn span::before{content:"↓ "}
.conn.usurp span::before,.conn.war span::before{content:"⚔ "}
.conn.branch span::before{content:"↳ "}
.conn.sib span::before{content:"⇄ "}

.ovlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ovrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;box-shadow:var(--shadow);cursor:pointer;transition:.18s}
.ovrow:hover{transform:translateX(3px);border-color:var(--gold)}
.ovrow .dot{flex:0 0 12px;height:12px;border-radius:50%}
.ovrow .ovname{font-family:"Songti SC",serif;font-size:16px;font-weight:700;color:var(--zhu-deep);flex:0 0 auto;min-width:56px}
.ovrow .ovmeta{flex:1;min-width:0}
.ovrow .ovy{font-size:12px;color:var(--gold);font-weight:700}
.ovrow .ovf{font-size:12px;color:var(--ink-l);margin-top:1px}
.ovrow .arrow{color:var(--ink-xl);font-size:14px}

.copyright{text-align:center;font-size:11px;color:var(--ink-xl);margin-top:24px;letter-spacing:.5px}
.hint{text-align:center;font-size:12px;color:var(--ink-xl);margin:12px 0 2px}

@media (max-width:520px){
  .card{margin-left:38px;padding:12px 12px}
  .card::before{left:-33px;width:27px;height:27px;font-size:12px}
  .tl::before{left:14px}
  .card .name{font-size:16px}
  .conn{margin-left:38px}
  .dynhead .dname{font-size:21px}
}

/* ===== 帝王详情 / 人物关系图 弹层 ===== */
.card.clickable{cursor:pointer;transition:.18s}
.card.clickable:hover{border-color:var(--gold);box-shadow:0 8px 26px rgba(200,90,30,.18);transform:translateY(-1px)}
.card .clickhint{margin-top:9px;font-size:11.5px;color:var(--gold);font-weight:700;text-align:right;letter-spacing:.5px;border-top:1px dashed var(--line);padding-top:6px}
.card .rel-line{margin:7px 0 1px;font-size:11.5px;color:var(--qing);background:#eef5f4;border-radius:8px;padding:4px 9px;border-left:3px solid var(--qing);line-height:1.5}

.overlay{position:fixed;inset:0;z-index:200;background:rgba(40,20,10,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;overflow-y:auto}
.overlay.show{display:flex;animation:fade .2s ease}
.sheet{background:var(--paper);width:100%;max-width:720px;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.45);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:9px;padding:12px 16px;
  background:linear-gradient(135deg,#7d1f1a,#a8322a);color:var(--gold-l);border-bottom:2px solid var(--gold);box-shadow:0 3px 12px rgba(0,0,0,.25)}
.sheet-bar .sname{font-family:"Songti SC","SimSun",serif;font-size:17.5px;font-weight:700;letter-spacing:1px;color:#f6e3ad}
.sheet-bar .stemple{font-size:11px;background:rgba(255,255,255,.16);border-radius:5px;padding:2px 7px;color:#ffe9c2}
.sheet-bar .sclose{margin-left:auto;font-size:24px;line-height:1;color:#ffe9c2;background:none;border:none;cursor:pointer;padding:0 6px;font-weight:300}
.sheet-bar .sclose:active{color:#fff}
.sheet-body{padding:16px 18px 48px}

.dossier .sec{margin:0 0 15px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow)}
.dossier .sec-h{font-family:"Songti SC",serif;font-size:15px;font-weight:700;color:var(--zhu-deep);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.dossier .sec-h .ico{width:23px;height:23px;border-radius:50%;background:linear-gradient(145deg,var(--zhu),var(--zhu-deep));color:var(--gold-l);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto;font-family:"Songti SC",serif}
.dossier .bio{font-size:13px;color:var(--ink);line-height:1.7}
.dossier .relbox{font-size:13px;color:#28504f;background:#eef5f4;border-radius:9px;padding:9px 12px;border-left:3px solid var(--qing);line-height:1.6}
.dossier ul{list-style:none}
.dossier li{position:relative;font-size:12.8px;padding-left:15px;margin:4px 0;line-height:1.55}
.dossier li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.dossier li b{color:var(--zhu-deep)}
.proscons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.proscons{grid-template-columns:1fr}}
.pc{border-radius:11px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.pc.plus{background:#f1f8ee;border:1px solid #cfe3c4;border-left:4px solid #5a9b4a}
.pc.minus{background:#fdf1ef;border:1px solid #eecdc8;border-left:4px solid #c0504a}
.pc h4{font-size:12.5px;margin-bottom:6px}
.pc.plus h4{color:#3d7a2e}
.pc.minus h4{color:#a8322a}
.pc ul{list-style:none;margin:0}
.pc li{position:relative;padding-left:12px;color:var(--ink);margin:3px 0;line-height:1.5;font-size:12.3px}
.pc li::before{content:"";position:absolute;left:2px;top:7px;width:4px;height:4px;border-radius:50%}
.pc.plus li::before{background:#5a9b4a}
.pc.minus li::before{background:#c0504a}

.figmap{margin-top:4px}
.figmap .map-h{font-family:"Songti SC",serif;font-size:16px;font-weight:700;color:var(--zhu-deep);margin:14px 0 3px;display:flex;align-items:center;gap:8px}
.figmap .map-h .ico{width:23px;height:23px;border-radius:50%;background:linear-gradient(145deg,#d98b2b,#b8641a);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto;font-family:"Songti SC",serif}
.figmap .map-sub{font-size:12px;color:var(--ink-l);margin-bottom:14px;line-height:1.5}
.figgroup{margin-bottom:15px}
.figgroup .gname{font-size:12.5px;font-weight:700;color:#fff;display:inline-block;border-radius:6px;padding:3px 12px;margin-bottom:9px;letter-spacing:.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.figcards{display:flex;flex-direction:column;gap:7px}
.figcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 12px;box-shadow:0 2px 8px rgba(120,80,40,.06);border-left:4px solid var(--gold)}
.figcard .fn{font-family:"Songti SC",serif;font-size:14.5px;font-weight:700;color:var(--zhu-deep)}
.figcard .fr{font-size:10.5px;color:#fff;background:var(--qing);border-radius:5px;padding:1px 7px;margin-left:7px;font-weight:600;vertical-align:middle;white-space:nowrap}
.figcard .fd{font-size:12.3px;color:var(--ink-l);margin-top:4px;line-height:1.55}
.figflow{margin-top:6px;background:linear-gradient(135deg,#fbf6e9,#f5ecd5);border:1px dashed var(--gold);border-radius:11px;padding:12px 14px;font-size:12.5px;color:var(--ink);line-height:1.7}
.figflow b{color:var(--zhu-deep)}
.figflow .fh{font-weight:700;color:var(--zhu-deep);display:flex;align-items:center;gap:6px;margin-bottom:6px;font-family:"Songti SC",serif;font-size:13.5px}

/* 人物卡「了解更多」按钮 */
.figcard .more{margin-top:8px;display:inline-block;font-size:11.5px;font-weight:700;color:var(--zhu);border:1px solid var(--zhu-l);border-radius:14px;padding:3px 12px;cursor:pointer;transition:.15s;background:#fff}
.figcard .more:hover{background:linear-gradient(145deg,var(--zhu),var(--zhu-deep));color:var(--gold-l);border-color:var(--zhu-deep)}
.figcard .more::after{content:" ›"}

/* 人物生平 弹层（叠在帝王弹层之上） */
#bio-overlay{z-index:300}
.bio-sheet{background:var(--paper);width:100%;max-width:720px;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.5);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
.bio-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:9px;padding:13px 16px;background:linear-gradient(135deg,#7d1f1a,#a8322a);color:var(--gold-l);border-bottom:2px solid var(--gold);box-shadow:0 3px 12px rgba(0,0,0,.25)}
.bio-bar .bname{font-family:"Songti SC",serif;font-size:19px;font-weight:700;letter-spacing:1px;color:#f6e3ad}
.bio-bar .bback{margin-left:auto;font-size:12px;color:#ffe9c2;background:rgba(255,255,255,.14);border:1px solid rgba(255,233,194,.4);border-radius:16px;padding:4px 12px;cursor:pointer}
.bio-bar .bback:active{background:rgba(255,255,255,.28)}
.bio-body{padding:16px 18px 50px}
.bio-hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:15px;border-top:4px solid var(--zhu)}
.bio-hero .big{font-family:"Songti SC",serif;font-size:25px;font-weight:700;color:var(--zhu-deep);letter-spacing:1px}
.bio-hero .yrs{display:inline-block;font-size:12.5px;color:#fff;background:var(--qing);border-radius:6px;padding:2px 10px;margin-left:10px;vertical-align:middle;font-weight:600}
.bio-sec{margin-bottom:15px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow)}
.bio-sec .bt{font-family:"Songti SC",serif;font-size:15px;font-weight:700;color:var(--zhu-deep);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.bio-sec .bt .ico{width:22px;height:22px;border-radius:50%;background:linear-gradient(145deg,var(--zhu),var(--zhu-deep));color:var(--gold-l);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:"Songti SC",serif}
.bio-sec .intro{font-size:13.5px;line-height:1.85;color:var(--ink)}
.bio-sec ul{list-style:none}
.bio-sec li{position:relative;font-size:13px;padding-left:18px;margin:7px 0;line-height:1.7;color:var(--ink)}
.bio-sec li::before{content:"";position:absolute;left:3px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.bio-eval{background:linear-gradient(135deg,#fbf6e9,#f5ecd5);border:1px dashed var(--gold);border-radius:12px;padding:13px 15px;font-size:13px;color:var(--ink);line-height:1.75}
.bio-eval b{color:var(--zhu-deep)}
</style>
</head>
<body>
<header class="header">
  <svg class="clouds" viewBox="0 0 1200 300" preserveAspectRatio="none"><g fill="#ffe6b0">
    <path d="M0,120 q40,-40 90,-18 q30,-40 90,-20 q40,-34 100,-10 q50,-30 110,4 q60,-30 120,-6 q50,-30 110,2 q50,-26 110,6 q60,-30 120,-4 q50,-26 110,8 L1200,0 L0,0 Z"/>
  </g></svg>
  <div class="seal">史</div>
  <h1>华夏朝代脉络</h1>
  <div class="sub">秦 · 前 221 ——— 今 · 两千两百余年</div>
</header>

<div class="topbar" id="topbar">
  <nav class="tabs" id="tabs"></nav>
  <nav class="subnav hide" id="subnav"></nav>
</div>

<main class="wrap" id="panels"></main>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-bar">
      <span class="sname" id="sh-name"></span>
      <span class="stemple" id="sh-temple"></span>
      <button class="sclose" id="sh-close" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="overlay" id="bio-overlay">
  <div class="bio-sheet">
    <div class="bio-bar">
      <span class="bname" id="bio-name"></span>
      <button class="bback" id="bio-close">← 返回</button>
    </div>
    <div class="bio-body" id="bio-body"></div>
  </div>
</div>

<footer class="wrap">
  <div class="hint">顶部切朝代 · 第二行是分期导航 ·「明」为完整十六帝详版，点任意帝王卡看生平/评价/人物关系图谱</div>
  <div class="copyright">华夏朝代脉络 · 秦→今　|　明史十六帝 · 帝王档案 + 人物关系图谱</div>
</footer>

<script>
/* ================= 数据：每个朝代为「多个分期板块」 ================= */
/* node: {name,b,temple,years,tags,pts,tp,tpLabel,link}  (b=徽章/身份) */
const CN=["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯"];

const DYN=[
 {id:"qin", name:"秦", years:"前221–前207", cap:"咸阳", span:"15年",
  ov:"中国第一个大一统王朝，确立中央集权，二世而亡。",

  bio:"朱元璋第四子，封燕王，镇守北平，久历战阵。靖难四年夺位，改元永乐。在位22年，五征漠北、迁都北京、修《永乐大典》、遣郑和下西洋，开创「永乐盛世」，但也以严酷手段巩固皇权、设东厂。",
  tags:["靖难夺位","天子守国门"],pts:["迁都北京、修《永乐大典》、<b>郑和七下西洋</b>、五征漠北","设东厂、彻底削藩，皇权极盛","设内阁、重用宦官，影响明代政治格局"],
  pros:["迁都北京、奠定「天子守国门」格局","郑和下西洋、宣扬国威，拓展海外影响","修《永乐大典》，集古文献之大成"],
  cons:["靖难夺位，得国不正，屠戮建文旧臣（方孝孺诛十族）","设东厂、倚重宦官，开明代特务政治之端","五征漠北、下西洋耗费巨大，民力负担沉重"],
  link:{t:"normal",l:"传位长子"}},
 {n:4,era:1,name:"朱高炽",temple:"明仁宗",years:"洪熙 1424–1425",
  rel:"朱棣长子。以皇太子继位，在位仅十个月。",
  bio:"朱棣长子，体胖多病，但仁厚贤明，长期以太子身份监国理政。即位后改元洪熙，一改永乐朝的扩张与严苛，赦免建文旧臣、停止劳民远征、与民休息，开启「仁宣之治」。在位仅十个月即病逝。",
  tags:["在位仅十个月","仁厚监国"],pts:["停劳民远征、罢下西洋宝船","赦建文旧臣、平反冤狱、废除苛政","开启<b>仁宣之治</b>，休养生息"],
  pros:["仁厚宽和、拨乱反正，为仁宣之治奠基","监国多年、沉稳有度，善用文臣","停止虚耗国力之举，与民休息"],
  cons:["在位仅十个月，很多改革未及展开","体弱多病，施政受健康所限"],
  link:{t:"normal",l:"传位长子"}},
 {n:5,era:1,name:"朱瞻基",temple:"明宣宗",years:"宣德 1425–1435",
  rel:"朱高炽长子。以皇太子继位。",
  bio:"朱高炽长子，自幼受祖父朱棣喜爱，多次随征漠北。即位后改元宣德，承父之政，政治清明、经济繁荣，与仁宗并称「仁宣之治」，为明朝国力巅峰。然设内书堂教宦官识字，埋下日后宦官专权隐患。",
  tags:["盛世顶峰","蟋蟀天子"],pts:["政治清明、经济繁荣，<b>仁宣之治</b>顶峰","亲征平定汉王朱高煦叛乱、放弃安南","设内书堂教宦官读书，<b>埋下宦官专权隐患</b>"],
  pros:["承仁宣之治，国力鼎盛、百姓富足","平汉王之乱、果断削藩，稳固皇权","知人善任，重用「三杨」等贤臣"],
  cons:["设内书堂教宦官识字参政，为后世宦官乱政埋根","个人雅好斗蟋蟀（「促织天子」），被后世讥评","放弃安南，虽减负但也放弃了对交趾的经营"],
  link:{t:"normal",l:"传位长子"}},
 {n:6,era:2,name:"朱祁镇",temple:"明英宗",years:"正统/天顺 1435–1449·1457–1464",
  rel:"朱瞻基长子。两度在位：正统朝先即位，土木堡被俘后由弟即位，复辟后又重登皇位。",
  bio:"朱瞻基长子，九岁即位。前期宠信宦官王振，1449年听其怂恿亲征瓦剌，酿成土木堡之变，皇帝被俘、京营精锐尽丧。其弟朱祁钰即位。次年放还，被软禁南宫。1457年「夺门之变」复辟，改元天顺，冤杀于谦。晚年废除宫妃殉葬。",
  tags:["宦官乱政","两度在位"],tp:true,tpLabel:"⚡ 土木堡之变 · 由盛转衰",pts:["前期宠信宦官王振、朝政败坏","<b>1449 土木堡之变</b>：皇帝被俘、精锐尽丧","夺门之变复辟、冤杀于谦","晚年废除宫妃殉葬制，尚存一善"],
  pros:["晚年废除残酷的宫妃殉葬制度，是一大善政","复辟后任用李贤等，政局一度平稳"],
  cons:["宠信王振、贸然亲征，酿成土木堡之变，明由盛转衰","复辟后冤杀北京保卫战的功臣于谦，自毁长城","两度在位，朝局动荡、党争埋根"],
  link:{t:"war",l:"土木堡被俘 · 弟即位"}},
 {n:7,era:2,name:"朱祁钰",temple:"明代宗",years:"景泰 1449–1457",
  rel:"朱瞻基次子，朱祁镇之弟。兄被俘后以监国即位，兄终弟及。",
  bio:"朱瞻基次子，本为郕王。土木堡之变后临危受命，由监国而即位，改元景泰。重用于谦打赢北京保卫战，挽救明朝于危亡。在位后期因易储、软禁还朝的英宗而失人心，夺门之变后被废，不久病逝。",
  tags:["临危受命","北京保卫战"],pts:["临危受命、任用于谦","<b>北京保卫战</b>击退瓦剌、挽救危局","易储风波失人心，夺门之变后被废、离奇病逝"],
  pros:["危难之际挺身而出，稳定朝局","重用于谦打赢北京保卫战，保全社稷"],
  cons:["废黜英宗之子、改立己子为太子，招致非议","软禁还朝的英宗，兄弟失和","夺门之变后遭废，身后不入太庙"],
  link:{t:"sib",l:"夺门之变 · 英宗复辟传子"}},
 {n:8,era:3,name:"朱见深",temple:"明宪宗",years:"成化 1464–1487",
  rel:"朱祁镇长子。以皇太子继位（幼年曾两立两废）。",
  bio:"朱祁镇长子，幼年因父被俘、复辟等变故而两立两废。即位后改元成化，平反于谦、安抚荆襄流民，然专宠年长十七岁的万贵妃，设西厂、用宦官汪直，朝政渐染弊病。",
  tags:["幼年两立两废","宠万贵妃"],pts:["平反于谦、安抚荆襄流民","宠万贵妃、设西厂、汪直专权","成化朝相对安定，但特务政治抬头"],
  pros:["平反于谦冤案，昭雪忠良","安置荆襄流民，缓解社会矛盾"],
  cons:["专宠万贵妃，后宫干政、外戚得势","设西厂、用汪直，宦官特务横行","晚年怠政，朝纲渐弛"],
  link:{t:"normal",l:"传位长子"}},
 {n:9,era:3,name:"朱祐樘",temple:"明孝宗",years:"弘治 1487–1505",
  rel:"朱见深第三子。以皇太子继位。",
  bio:"朱见深第三子，幼年因万贵妃所害而坎坷。即位后改元弘治，勤政节俭、重用贤臣、拨乱反正，史称「弘治中兴」。且终身只娶张皇后一人，不纳妃嫔，是中国历史上罕见的「一夫一妻」皇帝。",
  tags:["最完美皇帝","一夫一妻"],pts:["<b>弘治中兴</b>：拨乱反正、重用贤臣、国力回升","勤政节俭、恭俭有制，君臣和睦","终身只娶张皇后一人，一夫一妻"],
  pros:["勤政爱民、宽厚仁和，史称「弘治中兴」","重用刘健、李东阳、谢迁等贤臣","一夫一妻、恭俭自律，私德极佳，后世评价极高"],
  cons:["对外趋于保守，边患应对略显消极","身体素弱、英年早逝（36岁），改革未能更深","过度宽厚，对勋贵、宦官的约束有时偏软"],
  link:{t:"normal",l:"传位长子"}},
 {n:10,era:3,name:"朱厚照",temple:"明武宗",years:"正德 1505–1521",
  rel:"朱祐樘长子。以皇太子继位，无子嗣，帝位转旁支。",
  bio:"朱祐樘独子，幼年娇惯。即位后改元正德，荒嬉好武，建「豹房」、宠宦官刘瑾等「八虎」，自封「总督军务威武大将军」亲征。虽荒唐，却在应州大捷中亲征退敌。无子而崩，帝位转予旁支。",
  tags:["建豹房","宠刘瑾"],pts:["宠宦官刘瑾等「八虎」，刘瑾专权后伏诛","荒嬉建豹房、自封大将军，多次出巡","应州大捷亲征退敌；王阳明平宁王之乱","无子嗣，帝位转旁支"],
  pros:["应州之战亲征退蒙古，颇有武略","王阳明平宁王之乱，用人不拘一格"],
  cons:["荒嬉无度、建豹房、宠「八虎」，朝政败坏","刘瑾专权、特务横行，正德朝政治黑暗","无子而崩，引发继统之争（旁支入继）"],
  link:{t:"branch",l:"无子 · 旁支入继"}},
 {n:11,era:4,name:"朱厚熜",temple:"明世宗",years:"嘉靖 1521–1566",
  rel:"朱厚照堂弟，兴献王朱祐杬之子、朱祐樘之侄。以藩王入继大统（兄终弟及之变通）。",
  bio:"兴献王之子，武宗无子，以「兄终弟及」入继大统，改元嘉靖。即位初发动「大礼议」，追尊生父，击垮杨廷和集团、确立皇权。前期励精图治，后期崇道修玄、二十年不上朝，严嵩专权、倭寇猖獗。",
  tags:["大礼议","二十年不上朝"],pts:["以藩王入继、<b>大礼议之争</b>确立皇权","前期「嘉靖中兴」，后期崇道怠政","严嵩专权、倭寇大乱、庚戌之变","海瑞上《治安疏》直斥其非"],
  pros:["大礼议中展现强硬手腕，强化皇权","前期励精图治，一度有中兴气象","抗倭中后期任用戚继光、俞大猷，渐次平倭"],
  cons:["崇道修玄、二十年不上朝，怠于政事","宠信严嵩父子，专权贪腐近二十年","大礼议打压言路、廷杖群臣，士风受挫"],
  link:{t:"normal",l:"传位皇子"}},
 {n:12,era:4,name:"朱载坖",temple:"明穆宗",years:"隆庆 1567–1572",
  rel:"朱厚熜第三子。以皇太子继位。",
  bio:"朱厚熜第三子，即位后改元隆庆。在位仅六年，却办成两件大事：解除海禁（隆庆开关）、与蒙古俺答达成封贡互市，终结百年边患。内阁徐阶、高拱、张居正等人才济济，为万历改革铺路。",
  tags:["短短六年","含金量极高"],pts:["<b>隆庆开关</b>：解除海禁、开放月港","<b>俺答封贡</b>：终结蒙古百年边患","任用徐阶、高拱、张居正，铺路改革"],
  pros:["隆庆开关、俺答封贡，两大善政惠及深远","用人不疑，放手内阁贤臣理政","短短六年，奠定万历中兴基础"],
  cons:["在位仅六年，许多政策未及巩固","本人性格宽和近于软弱，倚重阁臣","后宫与内监仍有干政之弊"],
  link:{t:"normal",l:"传位皇子"}},
 {n:13,era:4,name:"朱翊钧",temple:"明神宗",years:"万历 1572–1620",
  rel:"朱载坖第三子。以皇太子继位（十岁冲龄即位）。",
  bio:"朱载坖第三子，十岁即位，改元万历，在位48年，为明朝在位最久的皇帝。前期由张居正辅政、推行一条鞭法，国力极盛，史称「万历中兴」；张居正死后亲政，因「国本之争」与群臣对抗，后期三十年不上朝，党争激化、后金崛起。",
  tags:["在位最长48年"],tp:true,tpLabel:"⚡ 怠政 + 后金崛起",pts:["前期张居正<b>一条鞭法</b>改革、国力极盛","<b>万历三大征</b>（宁夏·朝鲜·播州）皆胜","三十年不上朝、党争激烈","<b>努尔哈赤崛起、后金建立</b>"],
  pros:["前期张居正改革，国力达到晚明顶峰","万历三大征皆胜，援朝抗倭扬威东亚","在位最长，前期政局稳定、经济繁荣"],
  cons:["国本之争僵持、后期三十年怠政","矿监税使横征暴敛，民怨沸腾","党争激化、边备废弛，后金坐大（萨尔浒之败）"],
  link:{t:"normal",l:"传位长子"}},
 {n:14,era:5,name:"朱常洛",temple:"明光宗",years:"泰昌 1620",
  rel:"朱翊钧长子。以皇太子继位，在位仅一个月。",
  bio:"朱翊钧长子，因「国本之争」苦熬近二十年才被立为太子。即位后改元泰昌，然纵欲致病，服鸿胪寺丞李可灼所进「红丸」后暴毙，在位仅一个月，为明末「三大案」（梃击、红丸、移宫）的关键人物。",
  tags:["在位仅一个月","红丸案"],pts:["明末三大案之「<b>红丸案</b>」暴毙","即位即病、纵欲伤身","短暂在位，党争进一步激化"],
  pros:["即位初发银犒军、罢矿税，有恤民之意","身处国本之争而不失储位，隐忍多年"],
  cons:["纵欲享乐、即位即病，毫无作为","服红丸暴毙，引发党争与宫廷疑案","「三大案」交织，成为晚明党争导火索"],
  link:{t:"normal",l:"传位长子"}},
 {n:15,era:5,name:"朱由校",temple:"明熹宗",years:"天启 1620–1627",
  rel:"朱常洛长子。以皇太子继位，无子，传位弟弟。",
  bio:"朱常洛长子，即位后改元天启。痴迷木工，人称「木匠皇帝」，疏于朝政。宦官魏忠贤与乳母客氏勾结，阉党专权达到顶峰，残酷迫害东林党人。辽东战局靠孙承宗、袁崇焕苦撑。无子，传位其弟朱由检。",
  tags:["木匠皇帝"],tp:true,tpLabel:"⚡ 阉党乱政 + 天灾",pts:["疏于朝政、痴迷木工，「木匠皇帝」","<b>阉党巅峰</b>：魏忠贤专权、迫害东林党","辽东战局恶化、熊廷弼冤死","无子，传位弟弟"],
  pros:["任凭朝政败坏，但东林—阉党间尚有一线人才支撑辽东"],
  cons:["痴迷木工、不理朝政，皇权旁落","魏忠贤、客氏专权，阉党迫害东林六君子","冤杀辽东经略熊廷弼，自毁长城","天灾频仍（王恭厂大爆炸），国势急转直下"],
  link:{t:"sib",l:"无子 · 传位弟弟"}},
 {n:16,era:5,name:"朱由检",temple:"明思宗",years:"崇祯 1627–1644",
  rel:"朱常洛第五子，朱由校之弟。兄无子，以兄终弟及即位。",
  bio:"朱常洛第五子，兄熹宗无子，以信王入继，改元崇祯。即位即铲除魏忠贤、勤政节俭，然刚愎多疑、用人失当。内逢天灾瘟疫、农民起义，外临后金（清）压境，终在1644年李自成破北京时于煤山自缢，明亡。",
  tags:["勤政","多疑"],pts:["开局铲除阉党、勤政节俭","内：天灾、瘟疫、农民起义蜂起","外：后金（清）入寇、松锦失守","<b>1644 煤山自缢</b>，明亡"],
  pros:["铲除阉党、勤于政事、自奉节俭","明知不可为而为之，殉国守节「君王死社稷」"],
  cons:["刚愎多疑、频繁换相（十七年五十相）","中反间计冤杀袁崇焕，自坏长城","内外交困下无力回天，终致亡国（非亡国之君，而当亡国之运）"],
  link:null},
];

const MING_BIO={
"郭子兴":{y:"?—1355",i:"定远（今安徽定远）人，元末红巾军领袖之一，占据濠州。朱元璋早年投奔其麾下，因作战勇猛、机敏多谋而受赏识，郭子兴将养女马氏许配给他（即后来的马皇后）。",d:["聚众起义，据濠州，为元末最早起事的红巾军首领之一","赏识并提拔朱元璋，是其发迹的第一块跳板与岳父","与孙德崖等内部不和，势力受限，后病逝于军中"],e:"朱元璋帝业的引路人，明初追封滁阳王。"},
"徐达":{y:"1332—1385",i:"濠州钟离（今安徽凤阳）人，朱元璋同乡，明朝开国第一功臣、首任大将军。为人谨慎寡言、善于用兵、长于治军，深得朱元璋信任。",d:["统兵北伐，攻克元大都（北京），终结元朝在中原的统治","平定中原、西北，屡次出塞打击北元残部","为人谦恭、善抚士卒，不居功自傲，封魏国公，善终"],e:"洪武朝唯一真正做到「功高而不震主、位极而能善终」的开国元勋。"},
"常遇春":{y:"1330—1369",i:"怀远（今安徽怀远）人，朱元璋麾下头号猛将，以勇猛剽悍著称，自称能将十万众，军中号「常十万」。",d:["每战必先登、冲锋陷阵，与徐达并称「徐常」，为北伐先锋","参与灭陈友谅、破张士诚、北伐中原诸大战","北伐凯旋途中暴卒于军中，年仅四十"],e:"勇冠三军的开国猛将，朱元璋称其「虽古名将未有过之」。"},
"李文忠":{y:"1339—1384",i:"盱眙人，朱元璋的外甥兼养子，明初重要统帅，能征善战且通晓文墨。",d:["率军破张士诚、平定江南","北伐元廷，深入漠北、大破北元，封曹国公","后掌大都督府，兼理国子监"],e:"朱元璋亲属中少有的文武全才，可惜英年病逝。"},
"邓愈":{y:"1337—1377",i:"虹县（今安徽泗县）人，原名邓友德，少年起兵，后归附朱元璋，为明初名将。",d:["平定江西、安抚一方","随徐达北伐，又西征平定吐蕃、甘肃","封卫国公，班师途中病卒于寿春"],e:"明初开国名将，以平边之功著称。"},
"汤和":{y:"1326—1395",i:"濠州钟离人，与朱元璋是同乡发小，最早引荐朱元璋投奔红巾军的人。为人沉稳谨慎、知进退。",d:["早期引荐朱元璋入红巾军，为元老级人物","镇守东南沿海、平定方国珍、浙东","晚年主动交出兵权、告老还乡，成为极少数善终的开国元勋"],e:"以大智若愚、主动交权而安享晚年，明初功臣中的异数。"},
"沐英":{y:"1345—1392",i:"定远人，朱元璋的义子（养子），明初名将。",d:["随军征战、平定云南","平定云南后奉命留镇，经营滇地","其后代沐氏世世代代镇守云南，近三百年"],e:"开创沐氏「世镇云南」的格局，是明初经营西南的柱石。"},

"傅友德":{y:"?—1394",i:"砀山（今安徽砀山）人，明初悍将，历陈友谅而降朱元璋，骁勇善战。",d:["西征灭明升（夏政权）、平定四川","南下平定云南，功勋卓著，封颍国公","后因朱元璋猜忌，被逼自尽"],e:"南北征战、屡建奇功，终亦不能见容于洪武朝。"},
"刘基（刘伯温）":{y:"1311—1375",i:"字伯温，青田（今浙江文成）人，元末明初政治家、军事谋略家、文学家。元朝进士出身，后归附朱元璋，成为首席谋士。民间有「三分天下诸葛亮，一统江山刘伯温」之说。",d:["献「先陈后张」战略，助朱元璋先灭陈友谅、再取张士诚","参与筹划灭元、定天下的军国大计，运筹帷幄","明初任御史中丞、封诚意伯，主持整肃吏治、订立历法等","晚年遭胡惟庸等排挤，忧惧而卒（有被毒杀之说）"],e:"文武兼资的开国谋主，其智谋与操守为后世所推崇。"},
"李善长":{y:"1314—1390",i:"定远人，字百室，明初开国文臣之首，堪比汉之萧何。",d:["长期主持后方后勤、钱粮与制度草创","明初任左丞相，封韩国公，位列开国功臣","后因胡惟庸案牵连，被朱元璋赐死，全家七十余口被诛"],e:"开国首功之臣，却成为洪武大案中最令人唏嘘的牺牲者。"},
"宋濂":{y:"1310—1381",i:"字景濂，浦江（今浙江浦江）人，明初一代文宗、学者，与刘基并称「一代文宗」。",d:["总裁编修《元史》，为明代官方修史奠基","为太子朱标的老师，教导儒家治国之道","文名满天下，后被牵连胡惟庸案，流放途中病卒"],e:"开国文臣、太子之师，明代文章的开山宗师。"},
"朱升":{y:"1299—1370",i:"字允升，休宁人，明初谋臣、学者。",d:["向朱元璋进献「高筑墙、广积粮、缓称王」九字方略","为朱元璋定下稳健发展、避免树敌的立国战略","明初任翰林学士，参与制定礼制"],e:"九字方略影响深远，堪称明初战略总设计师之一。"},
"陈友谅":{y:"1320—1363",i:"沔阳（今湖北仙桃）人，元末最强割据势力首领，出身渔家，后参加红巾军，自立为帝，国号「汉」。",d:["据湖广、江西，拥兵数十万，为朱元璋最强劲的对手","1363年鄱阳湖大战，与朱元璋决战失利","中流矢而死，其「汉」政权随即瓦解"],e:"元末群雄中最强者，败于朱后天下鼎定之势始成。"},
"张士诚":{y:"1321—1367",i:"泰州白驹场（今江苏大丰）人，盐贩出身，元末割据江浙，自称「吴王」，据平江（苏州）。",d:["据富庶的江浙一带，经济实力雄厚","与朱元璋长期对抗，屡战不利","1367年平江城破被俘，自缢而死"],e:"据守膏腴之地却终为朱元璋所并，元末争霸的失败者。"},
"方国珍":{y:"1319—1374",i:"台州黄岩（今浙江台州）人，元末浙东沿海割据势力，以海运起家。",d:["据浙东沿海，拥海船、控海运","在元与朱元璋之间首鼠两端","最终归降朱元璋，得以善终"],e:"审时度势、及时归附，得以保全的元末地方势力。"},
"明玉珍":{y:"1331—1366",i:"随州（今湖北随州）人，元末红巾军将领，据四川建立「大夏」政权。",d:["率军入蜀，据有四川","在重庆称帝，国号「夏」，割据西南","死后其子明升继位，1371年降于明朝"],e:"西南割据一时，终归明朝一统。"},
"胡惟庸":{y:"?—1380",i:"定远人，明朝最后一任中书省丞相，淮西集团核心人物。",d:["由李善长举荐，官至左丞相，权倾朝野","独断专行、结党营私，与朱元璋矛盾激化","1380年以「谋反」罪被处死，朱元璋借机废除丞相制度、株连三万余人"],e:"「胡惟庸案」的直接主角，其死终结了中国千余年的丞相制。"},
"蓝玉":{y:"?—1393",i:"定远人，常遇春的妻弟，明初大将军，骁勇善战。",d:["捕鱼儿海（今贝尔湖）之战大破北元，俘获甚众，战功第一","居功自傲、骄横不法，蓄养庄奴、侵占民田","1393年以谋反罪被处死、剥皮实草，株连一万五千人（蓝玉案）"],e:"明初最能打的后期统帅，却也因骄横成为洪武屠戮的又一牺牲品。"},
"马皇后":{y:"1332—1382",i:"宿州人，郭子兴养女，朱元璋的结发妻子，明朝开国皇后。",d:["与朱元璋患难与共，早年曾烙饼藏怀救夫","屡次谏阻朱元璋滥杀，保全不少功臣与臣民","躬行节俭、体恤民情，为一代贤后"],e:"母仪天下、仁德贤明，朱元璋一生敬重的结发之妻。"},
"朱标":{y:"1355—1392",i:"朱元璋长子，洪武元年立为皇太子，性格仁厚宽和，深受儒臣拥戴。",d:["长期受教于宋濂等大儒，主张宽政","多次劝谏父皇少杀戮，与朱元璋严刑峻法形成对比","先于父亲病逝，其子朱允炆被立为皇太孙继位"],e:"仁厚太子英年早逝，直接改变了明朝的继承轨迹。"},
"朱棣":{y:"1360—1424",i:"朱元璋第四子，封燕王，镇守北平，即明成祖（永乐帝）。",d:["发动靖难之役，历时四年夺取侄子建文帝的皇位","迁都北京、五征漠北、修《永乐大典》、遣郑和下西洋","设内阁与东厂，强化皇权"],e:"雄才大略却得国不正，一手缔造永乐盛世。"},
"燕王朱棣":{y:"1360—1424",i:"即明成祖朱棣，朱元璋第四子。靖难之役前为镇守北平的燕王，起兵「清君侧」夺位后改元永乐。",d:["以燕王身份起兵靖难，击败建文朝廷","夺位后迁都北京、开永乐盛世","详见「朱棣」条目"],e:"靖难夺位者，永乐盛世的缔造者。"},
"齐泰":{y:"?—1402",i:"初名德，溧水（今江苏南京）人，建文帝朝兵部尚书，削藩主谋之一。",d:["与黄子澄力主削藩，建议先削强藩","靖难之役中主持对燕军事","南京陷落后被执，不屈而死，株连族人"],e:"建文削藩的核心决策者，殉节而亡。"},
"黄子澄":{y:"1350—1402",i:"名湜，分宜（今江西分宜）人，建文帝朝太常寺卿，削藩主要策划者。",d:["力主削藩，为建文帝出谋","用人失当，力荐李景隆统兵致败","靖难后被杀，株连九族"],e:"削藩谋主，谋略虽正而用人失误，终致败亡。"},
"方孝孺":{y:"1357—1402",i:"字希直，宁海（今浙江宁海）人，明初大儒、宋濂弟子，建文帝朝翰林学士，世称「正学先生」。",d:["一代儒宗，建文朝重臣，主持机要文書","朱棣夺位后令其草拟即位诏书，坚拒不从","被朱棣诛「十族」（牵连亲友门生），成为中国历史上最惨烈的士人殉节"],e:"以「天下读书种子」之气节名垂青史。"},
"盛庸":{y:"?—1403",i:"建文帝朝将领，靖难之役中明军的重要统帅。",d:["东昌之战大败燕军，斩杀燕军大将张玉","多次挫败朱棣南下","后势穷降燕，终被逼自尽"],e:"建文朝对燕作战中少有的胜将。"},
"铁铉":{y:"1366—1402",i:"字鼎石，邓州（今河南邓州）人，建文帝朝山东布政使、兵部尚书。",d:["坚守济南，屡挫燕军，朱棣久攻不下","以诈降计几乎砸死朱棣","南京陷落后被俘，骂贼不屈，被磔杀"],e:"忠烈死节的建文名臣，济南百姓立祠祀之。"},
"平安":{y:"?—1409",i:"建文帝朝骁将，靖难之役中屡败燕军。",d:["多次击败燕军，为建文朝依重的将领","兵败被俘后不屈","永乐年间自尽"],e:"靖难中令燕军忌惮的猛将。"},
"李景隆":{y:"?—1424",i:"曹国公李文忠之子，建文帝任命的征燕大将军。",d:["统率大军征燕，屡战屡败、丧师数十万","金川门之役开门迎降燕军","永乐朝一度被削爵圈禁"],e:"用人不当的典型，其败直接加速了建文的覆亡。"},
"宁王朱权":{y:"1378—1448",i:"朱元璋第十七子，封宁王，拥精锐「朵颜三卫」，镇守大宁。",d:["拥兵八万、战车六千，实力雄厚","被朱棣设计裹挟，助其靖难","靖难后改封南昌，郁郁不得志"],e:"被朱棣利用的强藩，其后代在正德朝还出了宁王之乱。"},
"姚广孝（道衍）":{y:"1335—1418",i:"长洲（今江苏苏州）人，僧人，法名道衍，靖难之役的首谋，人称「黑衣宰相」。",d:["力劝朱棣起兵靖难，为其运筹帷幄","辅佐朱棣夺位，功居第一","永乐朝主持修《永乐大典》、规划北京城"],e:"以僧人之身左右天下的奇人，靖难第一谋臣。"},
"张玉":{y:"1343—1401",i:"靖难功臣之首，原为元将，后归朱棣，骁勇善战。",d:["靖难中屡立战功，为燕军锋刃","东昌之战为救朱棣力战而死","为靖难第一功臣，追封河间王"],e:"靖难第一将，为救主而殉。"},
"朱能":{y:"1370—1406",i:"靖难功臣，燕军主将，骁勇多谋。",d:["靖难中屡破南军，为朱棣倚重","永乐朝封成国公，南征安南","征途中病卒于军"],e:"靖难主将与永乐朝重臣。"},
"丘福":{y:"1343—1409",i:"靖难功臣，燕军宿将。",d:["靖难中冲锋陷阵，功封淇国公","永乐七年北征鞑靼，轻敌冒进","全军覆没，战殁，被夺爵"],e:"靖难宿将，晚节因轻敌而败殁。"},
"解缙":{y:"1369—1415",i:"字大绅，吉水（今江西吉水）人，明初才子、内阁大学士。",d:["主持编纂《永乐大典》，为旷世文化工程","才思敏捷、直言敢谏","因立储等事触怒朱棣，下狱被害于雪中"],e:"一代才子，《永乐大典》的总设计师。"},
"杨士奇":{y:"1365—1444",i:"名寓，泰和（今江西泰和）人，历仕五朝，与杨荣、杨溥并称「三杨」，仁宣之治的核心辅臣。",d:["历仕建文至正统五朝，长期居内阁","主张宽政、休养生息，辅佐仁宣之治","为人宽厚、以德服人，后期因王振专权忧愤而卒"],e:"「三杨」之首，明前期文臣政治的典范。"},
"杨荣":{y:"1371—1440",i:"字勉仁，建安（今福建建瓯）人，「三杨」之一，以机敏善断、通晓边务著称。",d:["靖难时即迎附朱棣，后入内阁","五征漠北时随驾参赞军务","与杨士奇等共辅仁宣之治"],e:"「三杨」中的军事谋断之才。"},
"胡广":{y:"1370—1418",i:"字光大，吉水人，永乐朝内阁大学士。",d:["靖难后迎附朱棣，入值内阁","参与机务、修《永乐大典》","为官谨慎，善终"],e:"永乐朝稳健的内阁文臣。"},
"郑和":{y:"1371—1433",i:"本姓马，云南昆阳（今昆明晋宁）人，回族，宦官，明代伟大航海家。",d:["率庞大船队七下西洋，历时二十八年","最远到达非洲东海岸、红海沿岸","促进了明朝与亚非各国的朝贡贸易与文化交流"],e:"世界航海史上的先驱，七下西洋彪炳千古。"},
"陈诚":{y:"1365—1457",i:"吉水人，明初外交家。",d:["多次奉命出使西域（帖木儿帝国等）","重建明朝与中亚诸国的朝贡往来","著有《西域行程记》等"],e:"陆上丝绸之路的明代使者，与郑和的海路交相辉映。"},
"亦失哈":{y:"生卒年不详",i:"海西女真出身的宦官，永乐朝奉命经略东北。",d:["多次率船队巡视奴儿干都司（黑龙江下游）","设立驿站、册封当地部族","巩固明朝对东北边疆的管辖"],e:"经略东北边疆的重要执行者。"},
"朱高煦":{y:"1380—1426",i:"朱棣次子，封汉王，靖难中屡立战功，骄横不法、觊觎储位。",d:["靖难中冲锋陷阵、屡救朱棣","与太子朱高炽争储，被封汉王而不就藩","宣德元年效父起兵「靖难」，被宣宗亲征平定，废为庶人后被杀"],e:"野心勃勃的藩王，其叛乱败亡标志明初藩王势力的终结。"},
"汉王朱高煦":{y:"1380—1426",i:"即朱高煦，朱棣次子，封汉王。详见「朱高煦」条目。",d:["靖难有功、争储失败","宣德元年叛乱被平"],e:"野心藩王的典型。"},
"杨溥":{y:"1372—1446",i:"字弘济，石首（今湖北石首）人，「三杨」之一，以端谨持重著称。",d:["早年因事下狱十年，狱中苦读不辍","入阁后与杨士奇、杨荣同心辅政","为仁宣之治的重要辅臣"],e:"「三杨」中的端谨君子，以隐忍持重名世。"},
"夏原吉":{y:"1367—1430",i:"字维喆，湘阴（今湖南湘阴）人，明初杰出的理财名臣，长任户部尚书。",d:["主管户部二十余年，精于理财、仓廪充盈","永乐朝因谏阻北征下狱，洪熙即位后释放重用","辅佐仁宣之治，主张轻徭薄赋"],e:"明代最负盛名的理财家之一，历仕五朝。"},
"蹇义":{y:"1363—1435",i:"字宜之，巴县（今重庆）人，历仕五朝的吏部尚书。",d:["掌吏部铨选多年，谨慎老成","与三杨、夏原吉同心辅政","为仁宣之治的稳定力量"],e:"老成持重的铨选重臣。"},
"蹇义·夏原吉":{y:"—",i:"吏部尚书蹇义与户部尚书夏原吉，宣德朝六部元老，老成持重、稳定朝局。详见各自条目。",d:["蹇义掌吏部、夏原吉掌户部","共辅仁宣之治"],e:"宣德朝六部的两根支柱。"},
"黄淮":{y:"1367—1449",i:"字宗豫，永嘉（今浙江温州）人，东宫旧臣，长期辅佐太子朱高炽监国。",d:["永乐朝入内阁，辅佐太子监国","因汉王夺嫡事一度下狱十年","仁宗即位后获释重用"],e:"东宫旧臣，忠诚辅佐太子多年。"},
"金幼孜":{y:"1368—1431",i:"名善，新淦（今江西新干）人，历仕四朝的内阁文臣。",d:["永乐朝入内阁，随驾北征参赞军务","谨慎持重、随侍帷幄","辅佐仁宣之治"],e:"四朝元老，谨慎稳重的内阁重臣。"},
"王振":{y:"?—1449",i:"蔚州（今河北蔚县）人，英宗朝司礼监太监，明代第一个专权的大宦官。",d:["宣德朝由内书堂培养，英宗即位后掌司礼监","专权跋扈、排斥异己，被英宗尊为「先生」","1449年怂恿英宗亲征瓦剌，酿成土木堡之变，自己亦死于乱军"],e:"明代宦官专权的开端，土木堡惨祸的祸首。"},
"张辅":{y:"1375—1449",i:"字文弼，张玉之子，明初名将，四朝元老。",d:["四征安南、平定交趾，战功赫赫，封英国公","历仕永乐至正统四朝，德高望重","土木堡之变中随征，年逾七旬殁于乱军"],e:"四朝老将，以身殉国的开国功臣之后。"},
"石亨":{y:"?—1460",i:"渭南（今陕西渭南）人，明代将领。",d:["北京保卫战中有功，封武清侯","与徐有贞、曹吉祥发动夺门之变，助英宗复辟","居功骄横，后谋反被杀"],e:"以夺门之功骤贵，终因骄横谋反而亡。"},
"也先":{y:"?—1454",i:"瓦剌部首领，蒙古太师，土木堡之变的胜利者。",d:["1449年率瓦剌军大破明军，俘英宗于土木堡","挟英宗叩关，被于谦击退于北京城下","后因内部争斗被杀"],e:"一代蒙古枭雄，土木堡之变的主谋。"},
"于谦":{y:"1398—1457",i:"字廷益，钱塘（今浙江杭州）人，明代杰出的政治家、军事家、民族英雄。",d:["土木堡之变后力排南迁之议，拥立景泰帝","亲自督战北京九门，打赢北京保卫战，挽救明朝","英宗复辟后被诬杀，抄家时家无余财","留下「粉骨碎身浑不怕，要留清白在人间」的名句"],e:"「两袖清风、一身正气」的社稷忠臣，千古景仰。"},
"徐有贞":{y:"1407—1472",i:"字元玉，吴县（今江苏苏州）人，明代官员。",d:["土木堡后曾主张南迁，遭于谦斥责","与石亨、曹吉祥发动夺门之变","后与石亨争权被贬"],e:"夺门之变的策动者之一，功过参半。"},
"曹吉祥":{y:"?—1461",i:"宦官，参与夺门之变，助英宗复辟。",d:["参与夺门之变，获宠掌权","后谋反事败被诛","其养子曹钦亦参与谋反"],e:"以夺门得势，终因谋反而亡。"},
"王文":{y:"1393—1457",i:"字千之，束鹿（今河北辛集）人，景泰朝内阁重臣。",d:["景泰朝入阁，为于谦倚重","主张坚守北京、支持抗战","夺门之变后与于谦同被杀"],e:"景泰朝忠臣，与于谦同殉社稷。"},
"朱祁镇":{y:"1427—1464",i:"明英宗，朱瞻基长子，两度在位（正统、天顺）。",d:["九岁即位，前期宠信宦官王振","土木堡之变被俘，其弟景泰即位","夺门之变复辟，冤杀于谦；晚年废除宫妃殉葬"],e:"两度在位的曲折帝王，一生大起大落。"},
"万贵妃":{y:"1430—1487",i:"名贞儿，诸城（今山东诸城）人，明宪宗朱见深宠妃，长宪宗十七岁。",d:["自幼照料宪宗，专宠后宫数十年","恃宠而骄，干预朝政、左右后宫","庇护汪直、纵容其父万安等"],e:"明代最著名的一代宠妃，专宠一生。"},
"汪直":{y:"?—1487后",i:"大藤峡瑶人，成化朝宦官，掌西厂。",d:["设西厂，权倾一时，屡兴大狱","特务横行，朝野侧目","后失宠被贬，西厂一度罢废"],e:"成化朝宦官专权的代表，西厂的缔造者。"},
"商辂":{y:"1414—1486",i:"字弘载，淳安（今浙江淳安）人，明代唯一「连中三元」的阁臣。",d:["连中解元、会元、状元，明代唯一","成化朝入阁，屡谏汪直、力请罢西厂","为人刚正，为一代贤相"],e:"连中三元的稀世之才，正直敢谏的贤相。"},
"彭时":{y:"1416—1475",i:"字纯道，安福（今江西安福）人，成化朝内阁大学士。",d:["状元出身，入阁辅政","端谨持正，与商辂共持正议","屡谏宦官干政"],e:"端谨贤相，成化朝的正直力量。"},
"原杰":{y:"1417—1477",i:"字子英，阳城（今山西阳城）人，明代官员。",d:["巡抚荆襄，招抚流民数十万","奏设郧阳府，妥善安置流民","缓解了严重的社会矛盾"],e:"以抚治流民著称的地方能臣。"},
"刘健":{y:"1433—1526",i:"字希贤，洛阳人，弘治朝内阁首辅，为人刚正、持重。",d:["弘治三君子之首，为弘治朝第一辅臣","辅佐孝宗推行弘治中兴","正德初因弹劾刘瑾等「八虎」而致仕"],e:"弘治中兴的首功之臣，刚正不阿。"},
"李东阳":{y:"1447—1516",i:"字宾之，茶陵（今湖南茶陵）人，弘治朝内阁大学士、文坛领袖。",d:["与刘健、谢迁同心辅政，为弘治三君子之一","主盟文坛，「茶陵诗派」领袖","正德朝在刘瑾专权时委曲周旋、保全善类"],e:"文坛领袖、弘治名相，以委曲求全护佑正气。"},
"谢迁":{y:"1449—1531",i:"字于乔，余姚（今浙江余姚）人，弘治朝内阁大学士，为人刚直敢谏。",d:["弘治三君子之一，敢于直谏","与刘健同日致仕抗议刘瑾","后再度起复"],e:"刚直敢言的弘治名臣。"},
"王恕":{y:"1416—1508",i:"字宗贯，三原（今陕西三原）人，弘治朝吏部尚书，刚正敢言。",d:["掌吏部，整顿铨选、澄清吏治","屡次上疏直谏，声名卓著","为弘治中兴的重要推手"],e:"刚正敢言的「王恕号」，弘治中兴的吏治柱石。"},
"马文升":{y:"1426—1510",i:"字负图，钧州（今河南禹州）人，弘治朝兵部尚书，老成谋国。",d:["整饬边务、安定边陲","练达军事、屡次平定边患","与王恕等共辅弘治中兴"],e:"老成谋国的兵部尚书。"},
"刘大夏":{y:"1436—1516",i:"字时雍，华容（今湖南华容）人，弘治朝名臣，清廉干练。",d:["长任兵部、户部，理财有方","屡陈民间疾苦、裁抑浮费","被孝宗倚为长城"],e:"清廉干练、屡陈民瘼的弘治名臣。"},
"张皇后":{y:"1471—1541",i:"明孝宗朱祐樘唯一的皇后，兴济（今河北青县）人。",d:["孝宗终身只娶她一人，一夫一妻，千古罕见","与孝宗感情笃厚","正德、嘉靖朝作为太后仍有影响"],e:"「一夫一妻」帝后，中国历史上的独特佳话。"},
"刘瑾":{y:"1451—1510",i:"陕西兴平人，正德朝司礼监太监，「八虎」之首，权宦。",d:["正德朝专权乱政、贪腐无度","排斥异己、迫害朝臣，时称「立皇帝」","1510年以谋反罪被凌迟处死，百姓争食其肉"],e:"明代最贪婪跋扈的权宦之一，终遭凌迟。"},
"马永成":{y:"?—1521",i:"正德朝宦官，「八虎」之一。",d:["与刘瑾结党，把持内廷","掌司礼监等要职","刘瑾倒台后一度失势"],e:"「八虎」之一，祸乱正德朝局的宦官。"},
"谷大用":{y:"?—?",i:"正德朝宦官，掌西厂，「八虎」之一。",d:["掌西厂，与刘瑾同流","权倾一时","刘瑾败后请辞"],e:"「八虎」中的西厂头目。"},
"杨廷和":{y:"1459—1529",i:"字介夫，新都（今四川新都）人，正德、嘉靖初内阁首辅，三朝元老。",d:["正德朝屡遏宦祸，为朝中正派领袖","武宗死后主持朝政、迎立世宗","嘉靖初因「大礼议」力争而被迫致仕"],e:"三朝元老、定策之臣，「大礼议」中的旧派领袖。"},
"王阳明":{y:"1472—1529",i:"名守仁，余姚（今浙江余姚）人，明代杰出的思想家、军事家，「阳明心学」的创立者。",d:["以右佥都御史迅速平定宁王之乱","创立阳明心学，倡导「知行合一」「致良知」","集立德、立功、立言「三不朽」于一身"],e:"中国思想史上的巨擘，「三不朽」的完人典范。"},
"江彬":{y:"?—1521",i:"宣府（今河北宣化）人，正德朝边将、佞幸。",d:["诱导武宗巡游、嚣张跋扈","掌控京营、权倾一时","武宗死后被杨廷和等诛杀"],e:"诱帝荒嬉的佞幸，正德乱政的推手。"},
"钱宁":{y:"?—1521",i:"正德朝锦衣卫佞幸，以谄媚得宠。",d:["以锦衣卫掌事，与江彬争宠","贪权纳贿、败坏朝纲","后失势被诛"],e:"正德朝又一败坏朝政的佞幸。"},
"张璁":{y:"1475—1539",i:"字秉用，永嘉（今浙江温州）人，嘉靖朝「大礼议」中的新政派领袖，后任首辅。",d:["力挺世宗尊崇生父，助其打赢大礼议","官至内阁首辅，推行「嘉靖新政」、整肃吏治","为人刚愎、打击异己"],e:"大礼议的受益者，一度主导嘉靖初年的改革。"},
"桂萼":{y:"?—1531",i:"字子实，安仁（今江西余江）人，嘉靖朝「大礼议」新政派人物。",d:["与张璁同为议礼新贵","主张尊崇世宗生父","官至大学士，参与朝政"],e:"议礼新贵，与张璁共进退。"},
"严嵩":{y:"1480—1567",i:"字惟中，分宜（今江西分宜）人，嘉靖朝权臣，专权近二十年。",d:["以善写青词（道教祭文）得世宗宠信","官至内阁首辅，与其子严世蕃专权贪腐近二十年","陷害夏言、沈鍊等忠良，后败落饿死墓舍"],e:"明代最著名的奸相，「严嵩当国」为嘉靖朝一大弊政。"},
"严世蕃":{y:"1513—1565",i:"严嵩之子，依仗父势弄权，嘉靖朝大贪。",d:["助父专权、收受贿赂、卖官鬻爵","聪敏狡黠，被称为「嘉靖第一鬼才」","1565年被徐阶等参倒处斩"],e:"明代著名的大贪官，父子同恶。"},
"夏言":{y:"1482—1548",i:"字公谨，贵溪（今江西贵溪）人，嘉靖朝内阁首辅。",d:["官至首辅，力主收复河套","刚直敢言、不附严嵩","被严嵩构陷，弃市而死"],e:"正直不阿的首辅，冤死于严嵩之手。"},
"徐阶":{y:"1503—1583",i:"字子升，松江华亭（今上海松江）人，嘉靖朝后期首辅，一代名相。",d:["隐忍蓄势，最终参倒严嵩","嘉靖朝首辅，多有匡救","提携张居正，为隆庆、万历初政局奠基"],e:"隐忍有为的一代名相，扳倒严嵩的关键人物。"},
"海瑞":{y:"1514—1587",i:"字汝贤，琼山（今海南海口）人，明代著名清官，号「海青天」。",d:["上《治安疏》直斥嘉靖帝过失，抬棺死谏","任应天巡抚，整饬吏治、打击豪强","一生清廉刚直，刚正不阿"],e:"中国历史上最负盛名的清官之一，刚直不阿。"},
"戚继光":{y:"1528—1588",i:"字元敬，登州（今山东蓬莱）人，明代杰出的抗倭名将、军事家。",d:["编练「戚家军」，创鸳鸯阵，荡平东南倭寇","镇守蓟北，修缮长城、练兵御蒙古","著有《纪效新书》《练兵实纪》"],e:"抗倭第一名将，中国古代杰出的军事家。"},
"俞大猷":{y:"1503—1579",i:"字志辅，晋江（今福建泉州）人，明代抗倭名将。",d:["转战东南，与戚继光并称「俞龙戚虎」","平定东南倭患、征讨海盗","精通兵法、武艺高强"],e:"与戚继光齐名的抗倭名将。"},
"陆炳":{y:"1510—1560",i:"字文明，平湖（今浙江平湖）人，嘉靖朝锦衣卫都督，世宗乳兄弟。",d:["掌锦衣卫，权势极盛","与严嵩等关系复杂，亦曾保护部分正直官员","为嘉靖朝特务政治的核心人物"],e:"嘉靖朝权势最盛的锦衣卫头子。"},
"高拱":{y:"1513—1578",i:"字肃卿，新郑（今河南新郑）人，隆庆朝内阁首辅，干练果决。",d:["隆庆朝任首辅，锐意任事、整顿吏治","促成俺答封贡等事","与张居正争权，穆宗死后被逐"],e:"干练果决的隆庆首辅，改革过渡期的重要人物。"},
"张居正":{y:"1525—1582",i:"字叔大，江陵（今湖北荆州）人，万历初年内阁首辅，明代最杰出的改革家。",d:["柄国十年，推行「一条鞭法」与「考成法」","整饬吏治、富国强兵，史称「万历新政/中兴」","死后被万历帝清算，家产抄没、子孙流放"],e:"明代最伟大的改革家，「万历中兴」的缔造者。"},
"王崇古":{y:"1515—1588",i:"字学甫，蒲州（今山西永济）人，隆庆、万历朝总督。",d:["招降俺答之孙把汉那吉，作为筹码","促成「俺答封贡」，终结蒙古百年边患","稳定北方边境"],e:"俺答封贡的主要促成者，安边之功卓著。"},
"方逢时":{y:"1522—1596",i:"字行之，嘉鱼（今湖北嘉鱼）人，隆庆朝总督。",d:["与王崇古合力促成俺答封贡","整饬边防、安抚蒙古","为北疆安定作出重要贡献"],e:"与王崇古并称的封贡功臣。"},
"谭纶":{y:"1520—1577",i:"字子理，宜黄（今江西宜黄）人，明代抗倭名将、兵部尚书。",d:["与戚继光、俞大猷并肩抗倭","任蓟辽总督，主持北方防务","调戚继光镇蓟北，整饬边防"],e:"抗倭名将、统兵大员，戚继光的重要上级。"},
"李成梁":{y:"1526—1615",i:"字汝契，铁岭（今辽宁铁岭）人，万历朝辽东名将。",d:["镇守辽东数十年，屡破蒙古、女真","威震东北，一度维持辽东安定","晚年纵容努尔哈赤坐大，埋下辽东祸根"],e:"万历朝镇守辽东的宿将，功过并存。"},
"冯保":{y:"?—1583",i:"字永亭，深州（今河北深州）人，万历朝司礼监掌印太监。",d:["与张居正结盟，掌司礼监","为张居正改革提供内廷支撑","张居正死后被万历帝贬斥、抄家"],e:"张居正改革的「内相」盟友。"},
"李太后":{y:"1546—1614",i:"明神宗朱翊钧生母，隆庆帝贵妃，后为慈圣皇太后。",d:["对万历帝管教严格","前期坚定支持张居正辅政","万历亲政后影响力渐减"],e:"万历初年张居正改革的重要后台。"},
"李如松":{y:"1549—1598",i:"字子茂，李成梁长子，明代名将。",d:["平定宁夏哱拜之乱","率军援朝抗倭，平壤大捷威震日本","后战殁于蒙古部落"],e:"万历三大征中的骁将，援朝扬威。"},
"麻贵":{y:"?—1618",i:"大同右卫（今山西大同）人，明代将领，回族。",d:["参与平定宁夏之乱","率军援朝抗倭，屡破日军","万历三大征的重要将领"],e:"援朝抗倭的宿将，战功卓著。"},
"刘綎":{y:"?—1619",i:"字省吾，南昌人，明代猛将，人称「刘大刀」。",d:["援朝抗倭、平定播州杨应龙","勇冠三军，善用大刀","萨尔浒之战中孤军战死"],e:"万历朝第一猛将，萨尔浒殉国。"},
"陈璘":{y:"1543—1607",i:"字朝爵，翁源（今广东翁源）人，明代水师名将。",d:["率大明水师援朝抗倭","露梁海战统帅中朝联军水师，大破日本舰队","重创日军撤退之路"],e:"露梁海战的水师统帅，援朝功臣。"},
"邓子龙":{y:"1531—1598",i:"字武桥，丰城（今江西丰城）人，明代老将。",d:["年近七旬仍请缨援朝","露梁海战中冲锋陷阵","壮烈殉国"],e:"老当益壮、以身殉国的援朝英烈。"},
"申时行":{y:"1535—1614",i:"字汝默，长洲（今江苏苏州）人，万历朝内阁首辅。",d:["张居正之后继任首辅","在「国本之争」中居中调和、缓和矛盾","为人宽厚，力求稳定"],e:"调和派首辅，力图缓和国家本之争的裂痕。"},
"王锡爵":{y:"1534—1611",i:"字元驭，太仓（今江苏太仓）人，万历朝内阁首辅。",d:["继申时行主政","在国本之争中试图折衷","晚年归乡"],e:"万历中期力图调和的首辅。"},
"顾宪成":{y:"1550—1612",i:"字叔时，无锡人，东林党领袖。",d:["罢官后讲学东林书院、议论时政","「风声雨声读书声，声声入耳」的名联传世","开晚明「东林党」议政之风"],e:"东林党的精神领袖，晚明党争的源头之一。"},
"努尔哈赤":{y:"1559—1626",i:"姓爱新觉罗，建州女真人，后金（清）的建立者。",d:["统一女真各部，1616年建立后金","1618年「七大恨」起兵反明","1619年萨尔浒之战大败明军，辽东危局成形"],e:"清朝的奠基者，萨尔浒一役改变明清格局。"},
"杨镐":{y:"?—1629",i:"字京甫，商丘人，萨尔浒之战明军主帅。",d:["率四路大军进剿后金","四路分兵、被努尔哈赤各个击破","萨尔浒惨败后被下狱、后处死"],e:"萨尔浒惨败的主帅，明亡辽东的第一张多米诺骨牌。"},
"郑贵妃":{y:"1565—1630",i:"名梦境，大兴（今北京）人，万历帝宠妃，皇三子朱常洵生母。",d:["宠冠后宫，欲立己子朱常洵为太子","引发长达十五年的「国本之争」","「梃击案」疑与其势力有关"],e:"国本之争的核心人物，晚明党争的引信之一。"},
"李可灼":{y:"生卒年不详",i:"鸿胪寺丞，泰昌朝进献「红丸」者。",d:["进「红丸」给病中的光宗","光宗服药后暴毙","「红丸案」由此酿成宫廷疑案"],e:"「红丸案」的关键人物，一场宫廷疑云的中心。"},
"李选侍":{y:"?—?",i:"明光宗宠妃，移宫案主角。",d:["光宗死后挟太子朱由校占据乾清宫","图谋垂帘、控制新帝","被杨涟、左光斗等迫令移宫"],e:"「移宫案」的主角，晚明宫廷斗争的焦点。"},
"杨涟":{y:"1572—1625",i:"字文孺，应山（今湖北广水）人，东林党重要人物、左副都御史。",d:["泰昌朝力主「移宫」，拥立熹宗","天启朝上疏弹劾魏忠贤二十四大罪","被阉党下诏狱，惨受酷刑而死"],e:"东林党的铮铮铁骨，弹劾魏阉而殉难。"},
"左光斗":{y:"1575—1625",i:"字遗直，桐城（今安徽桐城）人，东林党要员、左佥都御史。",d:["与杨涟同主移宫、拥立熹宗","参与弹劾魏忠贤","同下诏狱，受酷刑而死"],e:"东林党直臣，与杨涟同殉。「东林六君子」之一。"},
"方从哲":{y:"?—1628",i:"字中涵，德清（今浙江德清）人，万历末内阁首辅。",d:["万历末年任首辅，处事柔顺","「红丸案」中饱受东林党攻讦","后致仕归乡"],e:"晚明争议首辅，红丸案中的靶心之一。"},
"魏忠贤":{y:"1568—1627",i:"肃宁（今河北肃宁）人，天启朝司礼监秉笔太监，明代权势最大的宦官，号「九千岁」。",d:["结熹宗乳母客氏，遍置党羽（阉党）","专权乱政，生祠遍天下，人称「九千岁」","残酷迫害东林党人，制造「东林六君子」等冤狱","崇祯即位后被清算，自缢而死"],e:"明代宦官专权的顶峰，遗臭万年的权宦。"},
"客氏":{y:"?—1627",i:"熹宗朱由校乳母，与魏忠贤勾结。",d:["与魏忠贤结为「对食」，把持内廷","干预后宫、残害其他嫔妃","崇祯即位后被杖毙"],e:"与魏忠贤狼狈为奸的女祸。"},
"魏大中":{y:"1575—1625",i:"字孔时，嘉善（今浙江嘉善）人，东林党人、吏科给事中。",d:["弹劾魏忠贤，为阉党所恨","被下诏狱，受酷刑而死","「东林六君子」之一"],e:"东林六君子之一，因弹劾阉党而殉。"},
"顾大章":{y:"1576—1625",i:"字伯钦，常熟（今江苏常熟）人，东林党人。",d:["为杨涟等下狱者营救申辩","被阉党罗织入狱","在狱中自尽（一说被毒杀）"],e:"东林六君子之一，以死明志。"},
"熊廷弼":{y:"1569—1625",i:"字飞白，江夏（今湖北武汉）人，明末辽东经略、军事家。",d:["两度出任辽东经略，力主固守、整饬边务","与巡抚王化贞不和，广宁之败后遭牵连","被阉党冤杀，传首九边"],e:"明末杰出的边才，死于党争的悲剧名将。"},
"孙承宗":{y:"1563—1638",i:"字稚绳，高阳（今河北高阳）人，明末军事家、蓟辽督师。",d:["构筑「关宁锦防线」，奠定辽东防御体系","练兵屯田、收复失地","晚年守高阳，清军破城时阖家殉国"],e:"明末辽东防御体系的总设计师，忠烈殉国。"},
"袁崇焕":{y:"1584—1630",i:"字元素，东莞（今广东东莞）人，明末抗清名将。",d:["宁远大捷，以红夷大炮重创努尔哈赤","宁锦大捷再挫皇太极","后中皇太极反间计，被崇祯以「通敌」罪凌迟处死"],e:"明末抗清柱石，千古奇冤的悲剧英雄。"},
"卢象升":{y:"1600—1639",i:"字建斗，宜兴（今江苏宜兴）人，明末名将、督师。",d:["组建「天雄军」，力战农民军","清军入塞时力主抗战","巨鹿之战孤军无援，力战而死"],e:"明末抗清的悲壮名将，孤军殉国。"},
"孙传庭":{y:"1593—1643",i:"字伯雅，代州振武卫（今山西代县）人，明末名将、陕西总督。",d:["擒获「闯王」高迎祥","扼守潼关、屡败李自成","潼关兵败战死，史称「传庭死而明亡」"],e:"明末最后的长城，其死标志明朝难挽危亡。"},
"曹文诏":{y:"?—1635",i:"大同（今山西大同）人，明末悍将。",d:["镇压农民军，战功赫赫","转战陕晋，屡败义军","湫头镇中伏，力战而死"],e:"明末镇压农民军的悍将，战死沙场。"},
"洪承畴":{y:"1593—1665",i:"字彦演，福建南安人，明末蓟辽总督，后降清。",d:["镇压农民军，一度为明廷倚重","松锦之战兵败被俘","降清后为清朝统一南方效力，成「贰臣」典型"],e:"由明之重臣转为清之开国功臣的「贰臣」。"},
"李自成":{y:"1606—1645",i:"米脂（今陕西米脂）人，明末农民起义军领袖，号「闯王」。",d:["提出「均田免赋」口号，深得民心","1644年在西安建「大顺」政权，旋即攻破北京","崇祯自缢后，败于清军与吴三桂联军"],e:"推翻明朝的农民军领袖，却未能坐稳天下。"},
"张献忠":{y:"1606—1647",i:"延安柳树涧（今陕西定边）人，明末农民起义军领袖，号「八大王」。",d:["转战南北，与李自成并称","1644年入四川，建「大西」政权","后在抗清中战死"],e:"与李自成齐名的明末农民军领袖。"},
"皇太极":{y:"1592—1643",i:"爱新觉罗氏，努尔哈赤第八子，后金汗、清太宗。",d:["1636年改「后金」为「清」，称帝","多次绕道入塞，重创明朝","用反间计诱崇祯冤杀袁崇焕"],e:"清朝的奠基之君，一手推动明清易代。"},
"多尔衮":{y:"1612—1650",i:"爱新觉罗氏，努尔哈赤第十四子，清初摄政王。",d:["1644年率清军入关、定鼎北京","辅佐顺治、主导清初统一战争","权倾朝野，死后一度被清算"],e:"清军入关的统帅，清朝大一统的实际推进者。"},
"王承恩":{y:"?—1644",i:"崇祯朝司礼监太监，崇祯帝的近侍。",d:["李自成破北京时随侍崇祯","随崇祯登煤山","与崇祯一同自缢殉国"],e:"唯一陪崇祯殉国的宦官，忠烈可悯。"}
};

// 把明转成 periods 结构（附 emp 供点击弹层）
DYN.find(d=>d.id==="ming").periods = MING_ERAS.map((e,idx)=>({name:e.name, sub:e.sub, nodes:MING_EMP.filter(x=>x.era===idx).map(x=>({...x,emp:x.n}))}));

/* ================= 渲染 ================= */
const tabsEl=document.getElementById('tabs'), subnav=document.getElementById('subnav'), panels=document.getElementById('panels');
const periodIndex={}; // dynId -> [{name,anchor}]

function cardHTML(sym,node){
  const clickable = node.emp!=null;
  let h=`<div class="card ${node.tp?'tp':''} ${clickable?'clickable':''}" data-n="${sym}"${clickable?` data-emp="${node.emp}"`:''}>`;
  if(node.tp&&node.tpLabel) h+=`<div class="tpflag">${node.tpLabel}</div>`;
  h+=`<div class="top"><span class="name">${node.name}</span>`;
  if(node.temple||node.b) h+=`<span class="temple">${node.temple||node.b}</span>`;
  if(node.years) h+=`<span class="years">${node.years}</span>`;
  h+=`</div>`;
  if(node.tags&&node.tags.length) h+=`<div class="tags">${node.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`;
  if(node.rel) h+=`<div class="rel-line">血脉：${node.rel}</div>`;
  h+=`<ul>${node.pts.map(p=>`<li>${p}</li>`).join("")}</ul>`;
  if(clickable) h+=`<div class="clickhint">点击查看 · 帝王详情与人物关系图谱 ›</div>`;
  h+=`</div>`;
  return h;
}
function connHTML(link){ return link?`<div class="conn ${link.t}"><span>${link.l}</span></div>`:""; }

/* 总览 */
let ovRows=DYN.map(d=>`<div class="ovrow" data-goto="${d.id}">
  <span class="dot" style="background:${d.full?'#a8322a':'#7d6a4f'}"></span>
  <span class="ovname">${d.name}</span>
  <span class="ovmeta"><span class="ovy">${d.years}</span><div class="ovf">${d.ov}</div></span>
  <span class="arrow">›</span></div>`).join("");
panels.innerHTML=`<section class="panel active" id="p-ov"><div class="dynhead">
  <div class="dname">朝代总览</div>
  <div class="dmeta"><span>秦 前221</span><span>→</span><span>今</span><span>两千两百余年</span></div>
  <div class="dov">点任一朝代进入其时间线；进入后顶部第二行会出现该朝的「分期导航」。「明」为完整十六帝详版。</div>
 </div><div class="ovlist">${ovRows}</div></section>`;

tabsEl.insertAdjacentHTML('beforeend',`<button class="ov active" data-tab="ov">总览</button>`);
const CN2=["一","二","三","四","五","六","七","八"];
DYN.forEach(d=>{
  let inner=`<div class="dynhead"><div class="dname">${d.name}</div>
    <div class="dmeta"><span>年代 <b>${d.years}</b></span><span>都城 <b>${d.cap}</b></span><span>国祚 <b>${d.span}</b></span></div>
    <div class="dov">${d.ov}</div></div>`;
  let tl="";
  periodIndex[d.id]=[];
  d.periods.forEach((per,pi)=>{
    const anchor=`era-${d.id}-${pi}`;
    periodIndex[d.id].push({name:per.name, anchor});
    tl+=`<div class="era" id="${anchor}"><span class="eno">${CN2[pi]||pi+1}</span><span class="ename">${per.name}</span><span class="esub">${per.sub||''}</span></div>`;
    per.nodes.forEach((node,ni)=>{ tl+=cardHTML(String(ni+1),node); });
    if(pi===d.periods.length-1 && d.to) tl+=connHTML(d.to);
  });
  inner+=`<div class="tl">${tl}</div>`;
  panels.insertAdjacentHTML('beforeend',`<section class="panel" id="p-${d.id}">${inner}</section>`);
  tabsEl.insertAdjacentHTML('beforeend',`<button data-tab="${d.id}">${d.name}</button>`);
});

let currentDyn="ov";
function setTopbarH(){
  const h=document.getElementById('topbar').offsetHeight;
  document.documentElement.style.setProperty('--topbar',(h+8)+'px');
}
function buildSubnav(id){
  if(id==='ov'||!periodIndex[id]){ subnav.classList.add('hide'); subnav.innerHTML=""; return; }
  subnav.classList.remove('hide');
  subnav.innerHTML=periodIndex[id].map((p,i)=>`<button data-anchor="${p.anchor}"><span class="sn">${CN2[i]||i+1}</span>${p.name}</button>`).join("");
  subIO.observe && observePeriods(id);
}
function activate(id){
  currentDyn=id;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));
  const p=document.getElementById('p-'+id); if(p)p.classList.add('active');
  const btn=document.querySelector(`.tabs button[data-tab="${id}"]`); if(btn)btn.scrollIntoView({inline:'center',block:'nearest'});
  buildSubnav(id);
  setTopbarH();
  // 滚到该朝头部（避免被吸顶遮住）
  const top=(p?p.getBoundingClientRect().top+window.scrollY:0)-(document.getElementById('topbar').offsetHeight)-6;
  window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
  // 高亮第一个分期
  setTimeout(()=>setActiveChip(0),60);
}
function setActiveChip(idx){
  document.querySelectorAll('.subnav button').forEach((b,i)=>b.classList.toggle('active',i===idx));
  const b=document.querySelectorAll('.subnav button')[idx]; if(b)b.scrollIntoView({inline:'center',block:'nearest'});
}

/* 点击分期导航 -> 跳转 */
subnav.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  const el=document.getElementById(b.dataset.anchor); if(!el)return;
  const top=el.getBoundingClientRect().top+window.scrollY-(document.getElementById('topbar').offsetHeight)-4;
  window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
});
tabsEl.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b)activate(b.dataset.tab); });
panels.addEventListener('click',e=>{ const r=e.target.closest('.ovrow'); if(r&&r.dataset.goto)activate(r.dataset.goto); });

/* ===== 帝王详情 / 人物关系图 弹层 ===== */
const overlay=document.getElementById('overlay'), sheetBody=document.getElementById('sheet-body');
function openEmp(n){
  const e=MING_EMP.find(x=>x.n===n); if(!e)return;
  const f=MING_FIGS[n]||{groups:[],flow:''};
  document.getElementById('sh-name').textContent=e.temple+' · '+e.name;
  document.getElementById('sh-temple').textContent=e.years;
  let h='<div class="dossier">';
  h+=`<div class="sec"><div class="sec-h"><span class="ico">生</span>帝王生平</div><div class="bio">${e.bio||''}</div></div>`;
  h+=`<div class="sec"><div class="sec-h"><span class="ico">脉</span>血缘与继承</div><div class="relbox">${e.rel||''}</div></div>`;
  h+=`<div class="sec"><div class="sec-h"><span class="ico">政</span>主要政绩与事件</div><ul>${e.pts.map(p=>`<li>${p}</li>`).join('')}</ul></div>`;
  h+=`<div class="sec"><div class="sec-h"><span class="ico">评</span>正面评价 · 争议点</div><div class="proscons">`;
  h+=`<div class="pc plus"><h4>✓ 正面评价</h4><ul>${(e.pros||[]).map(p=>`<li>${p}</li>`).join('')}</ul></div>`;
  h+=`<div class="pc minus"><h4>✕ 争议点</h4><ul>${(e.cons||[]).map(p=>`<li>${p}</li>`).join('')}</ul></div>`;
  h+=`</div></div></div>`;
  if(f.groups&&f.groups.length){
    h+=`<div class="figmap"><div class="map-h"><span class="ico">图</span>${f.title||'主要人物关系图谱'}</div>`;
    if(f.sub)h+=`<div class="map-sub">${f.sub}</div>`;
    f.groups.forEach(g=>{
      h+=`<div class="figgroup"><div class="gname" style="background:${g.color||'#a8322a'}">${g.g}</div><div class="figcards">`;
      g.members.forEach(m=>{ h+=`<div class="figcard"><span class="fn">${m.n}</span><span class="fr">${m.r}</span><div class="fd">${m.d}</div><span class="more" data-bio="${m.n}">了解人物生平事迹</span></div>`; });
      h+=`</div></div>`;
    });
    if(f.flow)h+=`<div class="figflow"><span class="fh">🔗 关系脉络</span>${f.flow}</div>`;
    h+=`</div>`;
  }
  sheetBody.innerHTML=h;
  overlay.classList.add('show');
  document.body.style.overflow='hidden';
  overlay.scrollTop=0;
}
function closeEmp(){ overlay.classList.remove('show'); document.body.style.overflow=''; }
document.getElementById('sh-close').addEventListener('click',closeEmp);
overlay.addEventListener('click',ev=>{ if(ev.target===overlay)closeEmp(); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape' && !document.getElementById('bio-overlay').classList.contains('show'))closeEmp(); });
panels.addEventListener('click',ev=>{ const c=ev.target.closest('.card.clickable'); if(c)openEmp(+c.dataset.emp); });

/* ===== 人物生平 弹层 ===== */
const bioOverlay=document.getElementById('bio-overlay'), bioBody=document.getElementById('bio-body');
function openBio(name){
  const b=MING_BIO[name];
  document.getElementById('bio-name').textContent=name;
  let h='';
  h+=`<div class="bio-hero"><div class="big">${name}</div>${(b&&b.y&&b.y!=='—'&&b.y!=='生卒年不详')?`<span class="yrs">${b.y}</span>`:''}</div>`;
  if(b){
    h+=`<div class="bio-sec"><div class="bt"><span class="ico">传</span>生平简介</div><div class="intro">${b.i||''}</div></div>`;
    if(b.d&&b.d.length) h+=`<div class="bio-sec"><div class="bt"><span class="ico">迹</span>主要事迹</div><ul>${b.d.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
    if(b.e) h+=`<div class="bio-eval"><b>📜 历史评价：</b>${b.e}</div>`;
  } else {
    h+=`<div class="bio-sec"><div class="intro">暂无详细资料。</div></div>`;
  }
  bioBody.innerHTML=h;
  bioOverlay.classList.add('show');
  bioOverlay.scrollTop=0;
}
function closeBio(){ bioOverlay.classList.remove('show'); }
document.getElementById('bio-close').addEventListener('click',closeBio);
bioOverlay.addEventListener('click',ev=>{ if(ev.target===bioOverlay)closeBio(); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape')closeBio(); });
document.getElementById('sheet-body').addEventListener('click',ev=>{ const m=ev.target.closest('.more'); if(m)openBio(m.dataset.bio); });

/* 滚动时高亮当前分期 */
let io=null;
function observePeriods(id){
  if(io)io.disconnect();
  const eras=[...document.querySelectorAll(`#p-${id} .era`)];
  io=new IntersectionObserver(entries=>{
    // 取当前最靠上、可见的期
    const vis=entries.filter(e=>e.isIntersecting);
    if(vis.length){
      const topOne=vis.reduce((a,b)=>a.boundingClientRect.top<b.boundingClientRect.top?a:b);
      const idx=eras.indexOf(topOne.target);
      if(idx>=0)setActiveChip(idx);
    }
  },{rootMargin:'-'+Math.round(document.getElementById('topbar').offsetHeight+10)+'px 0px -65% 0px',threshold:0});
  eras.forEach(el=>io.observe(el));
}
const subIO={observe:true}; // 占位

window.addEventListener('resize',()=>{ setTopbarH(); });
setTopbarH();
// hash 直达
if(location.hash){ const h=location.hash.slice(1); if(document.getElementById('p-'+h)) activate(h); else if(h==='ov')activate('ov'); }
</script>
