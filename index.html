<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>华夏朝代脉络 · 秦 → 今</title>
<style>
:root{
  --zhu:#a8322a; --zhu-deep:#7d1f1a; --zhu-l:#c0504a;
  --gold:#c9a227; --gold-l:#e6c665; --gold-pale:#f0dfa8;
  --paper:#f7f1e2; --paper-2:#efe5cf; --card:#fffdf6;
  --ink:#2b2320; --ink-l:#6b5d50; --ink-xl:#9a8d7d;
  --qing:#3a6b6b; --line:#e2d6bd;
  --shadow:0 6px 22px rgba(90,50,20,.10);
  --topbar: 90px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(circle at 12% 6%, rgba(201,162,39,.07), transparent 42%),
    radial-gradient(circle at 88% 3%, rgba(168,50,42,.06), transparent 40%),
    repeating-linear-gradient(0deg, rgba(120,80,40,.018) 0 2px, transparent 2px 4px),var(--paper);
  color:var(--ink);line-height:1.6;min-height:100vh;padding-bottom:40px}
.wrap{max-width:820px;margin:0 auto}

.header{position:relative;overflow:hidden;text-align:center;padding:32px 20px 24px;
  background:linear-gradient(150deg,#6e1a16 0%, #9c2d26 46%, #b8443a 100%);color:var(--gold-pale);border-bottom:3px solid var(--gold)}
.header .clouds{position:absolute;inset:0;opacity:.16;pointer-events:none}
.header .seal{width:54px;height:54px;margin:0 auto 8px;border-radius:11px;
  background:linear-gradient(150deg,#d8453b,#a8322a);border:2px solid var(--gold-l);
  display:flex;align-items:center;justify-content:center;font-family:"Songti SC","SimSun",serif;font-weight:700;font-size:27px;color:#ffe9c2;
  box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,225,160,.25)}
.header h1{font-family:"Songti SC","SimSun",serif;font-weight:700;font-size:clamp(23px,6.2vw,38px);letter-spacing:2px;color:#f6e3ad;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.header .sub{margin-top:5px;font-size:clamp(11.5px,3.2vw,14px);color:#e9cf9a;letter-spacing:1px}

/* sticky topbar: 2 rows */
.topbar{position:sticky;top:0;z-index:60;background:rgba(247,241,226,.97);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(120,80,40,.06)}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:8px 12px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;font-family:inherit;font-size:13px;font-weight:600;color:var(--zhu-deep);
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:5px 13px;white-space:nowrap;cursor:pointer;transition:.18s}
.tabs button.active{background:linear-gradient(145deg,var(--zhu),var(--zhu-deep));color:var(--gold-l);border-color:var(--zhu-deep);box-shadow:0 3px 10px rgba(125,31,26,.35)}
.tabs button.ov{color:var(--qing);border-color:#bcd4d2}
.tabs button.ov.active{background:linear-gradient(145deg,#3a6b6b,#28504f);color:#dfeeed}

/* subnav: period jump chips */
.subnav{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none;border-top:1px solid rgba(226,214,189,.7);padding-top:7px}
.subnav::-webkit-scrollbar{display:none}
.subnav.hide{display:none}
.subnav button{flex:0 0 auto;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--ink-l);
  background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:4px 11px;white-space:nowrap;cursor:pointer;transition:.18s}
.subnav button .sn{color:var(--zhu);font-weight:700;margin-right:3px}
.subnav button.active{background:linear-gradient(145deg,var(--gold),#b8912a);color:#3a2600;border-color:#b8912a;box-shadow:0 2px 8px rgba(201,162,39,.4)}
.subnav button.active .sn{color:#5a3a00}

.panel{padding:6px 16px 20px;display:none}
.panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.dynhead{margin:14px 0 6px;padding:15px 18px;border-radius:14px;color:#fff;
  background:linear-gradient(135deg,#7d1f1a,#a8322a 60%,#b8443a);box-shadow:var(--shadow);position:relative;overflow:hidden}
.dynhead .dname{font-family:"Songti SC",serif;font-size:25px;font-weight:700;color:var(--gold-l);letter-spacing:2px}
.dynhead .dmeta{margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:#f0dcb0}
.dynhead .dmeta b{color:#fff;font-weight:600}
.dynhead .dov{margin-top:8px;font-size:12.8px;color:#f3e2bd;line-height:1.55;border-top:1px solid rgba(240,220,160,.22);padding-top:7px}

.era{position:relative;z-index:2;margin:22px 0 12px -16px;padding:11px 18px 11px 22px;border-radius:0 40px 40px 0;
  background:linear-gradient(100deg,#7d1f1a,#a8322a);color:#ffe9c2;box-shadow:var(--shadow);border-left:6px solid var(--gold);
  scroll-margin-top:var(--topbar)}
.era .eno{font-family:"Songti SC",serif;font-size:20px;font-weight:700;color:var(--gold-l);margin-right:9px}
.era .ename{font-family:"Songti SC",serif;font-size:16px;font-weight:700;letter-spacing:1px}
.era .esub{display:block;font-size:11px;color:#dfc08f;margin-top:2px}

.tl{position:relative;padding:2px 0 4px}
.tl::before{content:"";position:absolute;left:18px;top:8px;bottom:10px;width:3px;
  background:linear-gradient(var(--gold-l),var(--zhu) 70%,var(--zhu-deep));border-radius:3px;opacity:.5}
.card{position:relative;z-index:1;margin:0 0 8px 44px;background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:13px 15px;box-shadow:var(--shadow)}
.card::before{content:attr(data-n);position:absolute;left:-38px;top:14px;width:30px;height:30px;border-radius:50%;
  background:linear-gradient(145deg,var(--zhu),var(--zhu-deep));color:var(--gold-l);font-family:"Songti SC",serif;font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--gold-l);box-shadow:0 2px 8px rgba(125,31,26,.4)}
.card .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .name{font-family:"Songti SC","SimSun",serif;font-size:17.5px;font-weight:700;color:var(--zhu-deep);letter-spacing:.5px}
.card .temple{font-size:11px;color:#fff;background:var(--zhu);border-radius:5px;padding:1px 6px;font-weight:600}
.card .years{font-size:12px;color:var(--gold);font-weight:700;margin-left:auto;white-space:nowrap}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 6px}
.card .tag{font-size:10.5px;color:var(--ink-l);background:var(--paper-2);border-radius:20px;padding:1px 8px}
.card ul{list-style:none;margin-top:2px}
.card li{position:relative;font-size:13px;color:var(--ink);padding-left:14px;margin:3px 0;line-height:1.55}
.card li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.card li b{color:var(--zhu-deep);font-weight:600}
.card.tp{border-color:#e7b98f;box-shadow:0 6px 22px rgba(200,90,30,.16),0 0 0 2px rgba(201,162,39,.18)}
.card.tp::before{background:linear-gradient(145deg,#d98b2b,#b8641a)}
.card .tpflag{display:inline-block;font-size:10.5px;font-weight:700;color:#7d3a00;background:linear-gradient(90deg,#f4d27a,#e9b949);border-radius:5px;padding:1px 8px;margin-bottom:6px}

.conn{margin:0 0 8px 44px;position:relative;height:30px;display:flex;align-items:center}
.conn::before{content:"";position:absolute;left:-20px;top:50%;width:14px;height:2px;background:var(--gold);opacity:.6}
.conn span{font-size:11px;border-radius:20px;padding:2px 11px;font-weight:600;background:#fff;border:1px solid var(--line);color:var(--ink-l)}
.conn.usurp span,.conn.war span{color:var(--zhu);border-color:#e4b7b3;background:#fdf3f2}
.conn.branch span,.conn.sib span{color:var(--qing);border-color:#b6d0cf;background:#f0f7f6}
.conn span::before{content:"↓ "}
.conn.usurp span::before,.conn.war span::before{content:"⚔ "}
.conn.branch span::before{content:"↳ "}
.conn.sib span::before{content:"⇄ "}

.ovlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ovrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;box-shadow:var(--shadow);cursor:pointer;transition:.18s}
.ovrow:hover{transform:translateX(3px);border-color:var(--gold)}
.ovrow .dot{flex:0 0 12px;height:12px;border-radius:50%}
.ovrow .ovname{font-family:"Songti SC",serif;font-size:16px;font-weight:700;color:var(--zhu-deep);flex:0 0 auto;min-width:56px}
.ovrow .ovmeta{flex:1;min-width:0}
.ovrow .ovy{font-size:12px;color:var(--gold);font-weight:700}
.ovrow .ovf{font-size:12px;color:var(--ink-l);margin-top:1px}
.ovrow .arrow{color:var(--ink-xl);font-size:14px}

.copyright{text-align:center;font-size:11px;color:var(--ink-xl);margin-top:24px;letter-spacing:.5px}
.hint{text-align:center;font-size:12px;color:var(--ink-xl);margin:12px 0 2px}

@media (max-width:520px){
  .card{margin-left:38px;padding:12px 12px}
  .card::before{left:-33px;width:27px;height:27px;font-size:12px}
  .tl::before{left:14px}
  .card .name{font-size:16px}
  .conn{margin-left:38px}
  .dynhead .dname{font-size:21px}
}

/* ===== 帝王详情 / 人物关系图 弹层 ===== */
.card.clickable{cursor:pointer;transition:.18s}
.card.clickable:hover{border-color:var(--gold);box-shadow:0 8px 26px rgba(200,90,30,.18);transform:translateY(-1px)}
.card .clickhint{margin-top:9px;font-size:11.5px;color:var(--gold);font-weight:700;text-align:right;letter-spacing:.5px;border-top:1px dashed var(--line);padding-top:6px}
.card .rel-line{margin:7px 0 1px;font-size:11.5px;color:var(--qing);background:#eef5f4;border-radius:8px;padding:4px 9px;border-left:3px solid var(--qing);line-height:1.5}

.overlay{position:fixed;inset:0;z-index:200;background:rgba(40,20,10,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;overflow-y:auto}
.overlay.show{display:flex;animation:fade .2s ease}
.sheet{background:var(--paper);width:100%;max-width:720px;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.45);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:9px;padding:12px 16px;
  background:linear-gradient(135deg,#7d1f1a,#a8322a);color:var(--gold-l);border-bottom:2px solid var(--gold);box-shadow:0 3px 12px rgba(0,0,0,.25)}
.sheet-bar .sname{font-family:"Songti SC","SimSun",serif;font-size:17.5px;font-weight:700;letter-spacing:1px;color:#f6e3ad}
.sheet-bar .stemple{font-size:11px;background:rgba(255,255,255,.16);border-radius:5px;padding:2px 7px;color:#ffe9c2}
.sheet-bar .sclose{margin-left:auto;font-size:24px;line-height:1;color:#ffe9c2;background:none;border:none;cursor:pointer;padding:0 6px;font-weight:300}
.sheet-bar .sclose:active{color:#fff}
.sheet-body{padding:16px 18px 48px}

.dossier .sec{margin:0 0 15px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow)}
.dossier .sec-h{font-family:"Songti SC",serif;font-size:15px;font-weight:700;color:var(--zhu-deep);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.dossier .sec-h .ico{width:23px;height:23px;border-radius:50%;background:linear-gradient(145deg,var(--zhu),var(--zhu-deep));color:var(--gold-l);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto;font-family:"Songti SC",serif}
.dossier .bio{font-size:13px;color:var(--ink);line-height:1.7}
.dossier .relbox{font-size:13px;color:#28504f;background:#eef5f4;border-radius:9px;padding:9px 12px;border-left:3px solid var(--qing);line-height:1.6}
.dossier ul{list-style:none}
.dossier li{position:relative;font-size:12.8px;padding-left:15px;margin:4px 0;line-height:1.55}
.dossier li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.dossier li b{color:var(--zhu-deep)}
.proscons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.proscons{grid-template-columns:1fr}}
.pc{border-radius:11px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.pc.plus{background:#f1f8ee;border:1px solid #cfe3c4;border-left:4px solid #5a9b4a}
.pc.minus{background:#fdf1ef;border:1px solid #eecdc8;border-left:4px solid #c0504a}
.pc h4{font-size:12.5px;margin-bottom:6px}
.pc.plus h4{color:#3d7a2e}
.pc.minus h4{color:#a8322a}
.pc ul{list-style:none;margin:0}
.pc li{position:relative;padding-left:12px;color:var(--ink);margin:3px 0;line-height:1.5;font-size:12.3px}
.pc li::before{content:"";position:absolute;left:2px;top:7px;width:4px;height:4px;border-radius:50%}
.pc.plus li::before{background:#5a9b4a}
.pc.minus li::before{background:#c0504a}

.figmap{margin-top:4px}
.figmap .map-h{font-family:"Songti SC",serif;font-size:16px;font-weight:700;color:var(--zhu-deep);margin:14px 0 3px;display:flex;align-items:center;gap:8px}
.figmap .map-h .ico{width:23px;height:23px;border-radius:50%;background:linear-gradient(145deg,#d98b2b,#b8641a);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto;font-family:"Songti SC",serif}
.figmap .map-sub{font-size:12px;color:var(--ink-l);margin-bottom:14px;line-height:1.5}
.figgroup{margin-bottom:15px}
.figgroup .gname{font-size:12.5px;font-weight:700;color:#fff;display:inline-block;border-radius:6px;padding:3px 12px;margin-bottom:9px;letter-spacing:.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.figcards{display:flex;flex-direction:column;gap:7px}
.figcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 12px;box-shadow:0 2px 8px rgba(120,80,40,.06);border-left:4px solid var(--gold)}
.figcard .fn{font-family:"Songti SC",serif;font-size:14.5px;font-weight:700;color:var(--zhu-deep)}
.figcard .fr{font-size:10.5px;color:#fff;background:var(--qing);border-radius:5px;padding:1px 7px;margin-left:7px;font-weight:600;vertical-align:middle;white-space:nowrap}
.figcard .fd{font-size:12.3px;color:var(--ink-l);margin-top:4px;line-height:1.55}
.figflow{margin-top:6px;background:linear-gradient(135deg,#fbf6e9,#f5ecd5);border:1px dashed var(--gold);border-radius:11px;padding:12px 14px;font-size:12.5px;color:var(--ink);line-height:1.7}
.figflow b{color:var(--zhu-deep)}
.figflow .fh{font-weight:700;color:var(--zhu-deep);display:flex;align-items:center;gap:6px;margin-bottom:6px;font-family:"Songti SC",serif;font-size:13.5px}
</style>
</head>
<body>
<header class="header">
  <svg class="clouds" viewBox="0 0 1200 300" preserveAspectRatio="none"><g fill="#ffe6b0">
    <path d="M0,120 q40,-40 90,-18 q30,-40 90,-20 q40,-34 100,-10 q50,-30 110,4 q60,-30 120,-6 q50,-30 110,2 q50,-26 110,6 q60,-30 120,-4 q50,-26 110,8 L1200,0 L0,0 Z"/>
  </g></svg>
  <div class="seal">史</div>
  <h1>华夏朝代脉络</h1>
  <div class="sub">秦 · 前 221 ——— 今 · 两千两百余年</div>
</header>

<div class="topbar" id="topbar">
  <nav class="tabs" id="tabs"></nav>
  <nav class="subnav hide" id="subnav"></nav>
</div>

<main class="wrap" id="panels"></main>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-bar">
      <span class="sname" id="sh-name"></span>
      <span class="stemple" id="sh-temple"></span>
      <button class="sclose" id="sh-close" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<footer class="wrap">
  <div class="hint">顶部切朝代 · 第二行是分期导航 ·「明」为完整十六帝详版，点任意帝王卡看生平/评价/人物关系图谱</div>
  <div class="copyright">华夏朝代脉络 · 秦→今　|　明史十六帝 · 帝王档案 + 人物关系图谱</div>
</footer>

<script>
/* ================= 数据：每个朝代为「多个分期板块」 ================= */
/* node: {name,b,temple,years,tags,pts,tp,tpLabel,link}  (b=徽章/身份) */
const CN=["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯"];

const DYN=[
 {id:"qin", name:"秦", years:"前221–前207", cap:"咸阳", span:"15年",
  ov:"中国第一个大一统王朝，确立中央集权，二世而亡。",
  periods:[
   {name:"横扫六合", sub:"统一与建制", nodes:[
     {name:"秦始皇·嬴政", b:"始皇帝", years:"前221–前210", tags:["大一统","始皇帝"],
      pts:["灭六国、一统天下","<b>皇帝制 / 三公九卿 / 郡县制</b>","书同文、车同轨、统一度量衡与货币","修长城、驰道，焚书坑儒"]},
   ]},
   {name:"盛极而亡", sub:"二世而亡", nodes:[
     {name:"秦二世·胡亥", b:"二世", years:"前210–前207", tags:["二世而亡"],
      pts:["赵高专权、指鹿为马","<b>陈胜吴广起义</b>（前209）","项羽、刘邦起兵，秦亡"]},
   ]},
  ], to:{t:"war", l:"楚汉相争 → 汉"}},

 {id:"han", name:"汉", years:"前202–220", cap:"长安 / 洛阳", span:"约400年",
  ov:"「汉承秦制」，奠定汉族与中华文化基本盘；分西汉、东汉，中间夹王莽新朝。",
  periods:[
   {name:"西汉·奠基与鼎盛", sub:"高祖 → 文景 → 武帝", nodes:[
     {name:"汉高祖·刘邦", b:"西汉", years:"前202–前195", tags:["开国"], pts:["楚汉相争胜、建汉","郡国并行、休养生息","白登之围"]},
     {name:"文景之治", b:"西汉", years:"前180–前141", tags:["治世"], pts:["与民休息、轻徭薄赋","平定七国之乱"]},
     {name:"汉武帝·刘彻", b:"西汉", years:"前141–前87", tags:["雄才大略"], pts:["<b>独尊儒术</b>","北击匈奴（卫青·霍去病）","张骞通西域、开丝绸之路","盐铁官营、推恩令"]},
   ]},
   {name:"新莽与东汉", sub:"篡汉 → 光武中兴 → 衰亡", nodes:[
     {name:"王莽篡汉·新朝", b:"新", years:"8–23", tags:["篡位"], pts:["代汉建「新」","托古改制失败、天下大乱"]},
     {name:"光武帝·刘秀", b:"东汉", years:"25–57", tags:["光武中兴"], pts:["重建汉朝、定都洛阳","光武中兴"]},
     {name:"东汉中后期", b:"东汉", years:"57–189", tags:["外戚宦官"], pts:["明章之治后转衰","外戚宦官交替、党锢之祸","<b>黄巾起义</b>（184）"]},
     {name:"群雄割据", b:"东汉末", years:"189–220", tags:["乱世"], pts:["董卓之乱","曹操挟天子以令诸侯","曹丕篡汉"]},
   ]},
  ], to:{t:"normal", l:"汉末三分 → 三国"}},

 {id:"sanguo", name:"三国", years:"220–280", cap:"洛阳/成都/建业", span:"60年",
  ov:"魏、蜀、吴三分天下，英雄辈出的时代。",
  periods:[

 {n:6,era:2,name:"朱祁镇",temple:"明英宗",years:"正统/天顺 1435–1449·1457–1464",

 {n:7,era:2,name:"朱祁钰",temple:"明代宗",years:"景泰 1449–1457",

  tags:["临危受命","北京保卫战"],pts:["临危受命、任用于谦","<b>北京保卫战</b>击退瓦剌、挽救危局","易储风波失人心，夺门之变后被废、离奇病逝"],

 {n:8,era:3,name:"朱见深",temple:"明宪宗",years:"成化 1464–1487",

  tags:["幼年两立两废","宠万贵妃"],pts:["平反于谦、安抚荆襄流民","宠万贵妃、设西厂、汪直专权","成化朝相对安定，但特务政治抬头"],

  link:{t:"normal",l:"传位长子"}},
 {n:9,era:3,name:"朱祐樘",temple:"明孝宗",years:"弘治 1487–1505",
  rel:"朱见深第三子。以皇太子继位。",
  bio:"朱见深第三子，幼年因万贵妃所害而坎坷。即位后改元弘治，勤政节俭、重用贤臣、拨乱反正，史称「弘治中兴」。且终身只娶张皇后一人，不纳妃嫔，是中国历史上罕见的「一夫一妻」皇帝。",
  tags:["最完美皇帝","一夫一妻"],pts:["<b>弘治中兴</b>：拨乱反正、重用贤臣、国力回升","勤政节俭、恭俭有制，君臣和睦","终身只娶张皇后一人，一夫一妻"],
  pros:["勤政爱民、宽厚仁和，史称「弘治中兴」","重用刘健、李东阳、谢迁等贤臣","一夫一妻、恭俭自律，私德极佳，后世评价极高"],
  cons:["对外趋于保守，边患应对略显消极","身体素弱、英年早逝（36岁），改革未能更深","过度宽厚，对勋贵、宦官的约束有时偏软"],

 {n:10,era:3,name:"朱厚照",temple:"明武宗",years:"正德 1505–1521",
  rel:"朱祐樘长子。以皇太子继位，无子嗣，帝位转旁支。",
  bio:"朱祐樘独子，幼年娇惯。即位后改元正德，荒嬉好武，建「豹房」、宠宦官刘瑾等「八虎」，自封「总督军务威武大将军」亲征。虽荒唐，却在应州大捷中亲征退敌。无子而崩，帝位转予旁支。",
  tags:["建豹房","宠刘瑾"],pts:["宠宦官刘瑾等「八虎」，刘瑾专权后伏诛","荒嬉建豹房、自封大将军，多次出巡","应州大捷亲征退敌；王阳明平宁王之乱","无子嗣，帝位转旁支"],
  pros:["应州之战亲征退蒙古，颇有武略","王阳明平宁王之乱，用人不拘一格"],

  link:{t:"branch",l:"无子 · 旁支入继"}},
 {n:11,era:4,name:"朱厚熜",temple:"明世宗",years:"嘉靖 1521–1566",
  rel:"朱厚照堂弟，兴献王朱祐杬之子、朱祐樘之侄。以藩王入继大统（兄终弟及之变通）。",
  bio:"兴献王之子，武宗无子，以「兄终弟及」入继大统，改元嘉靖。即位初发动「大礼议」，追尊生父，击垮杨廷和集团、确立皇权。前期励精图治，后期崇道修玄、二十年不上朝，严嵩专权、倭寇猖獗。",
  tags:["大礼议","二十年不上朝"],pts:["以藩王入继、<b>大礼议之争</b>确立皇权","前期「嘉靖中兴」，后期崇道怠政","严嵩专权、倭寇大乱、庚戌之变","海瑞上《治安疏》直斥其非"],
  pros:["大礼议中展现强硬手腕，强化皇权","前期励精图治，一度有中兴气象","抗倭中后期任用戚继光、俞大猷，渐次平倭"],
  cons:["崇道修玄、二十年不上朝，怠于政事","宠信严嵩父子，专权贪腐近二十年","大礼议打压言路、廷杖群臣，士风受挫"],
  link:{t:"normal",l:"传位皇子"}},
 {n:12,era:4,name:"朱载坖",temple:"明穆宗",years:"隆庆 1567–1572",

  bio:"朱厚熜第三子，即位后改元隆庆。在位仅六年，却办成两件大事：解除海禁（隆庆开关）、与蒙古俺答达成封贡互市，终结百年边患。内阁徐阶、高拱、张居正等人才济济，为万历改革铺路。",
  tags:["短短六年","含金量极高"],pts:["<b>隆庆开关</b>：解除海禁、开放月港","<b>俺答封贡</b>：终结蒙古百年边患","任用徐阶、高拱、张居正，铺路改革"],
  pros:["隆庆开关、俺答封贡，两大善政惠及深远","用人不疑，放手内阁贤臣理政","短短六年，奠定万历中兴基础"],
  cons:["在位仅六年，许多政策未及巩固","本人性格宽和近于软弱，倚重阁臣","后宫与内监仍有干政之弊"],
  link:{t:"normal",l:"传位皇子"}},
 {n:13,era:4,name:"朱翊钧",temple:"明神宗",years:"万历 1572–1620",

  tags:["在位最长48年"],tp:true,tpLabel:"⚡ 怠政 + 后金崛起",pts:["前期张居正<b>一条鞭法</b>改革、国力极盛","<b>万历三大征</b>（宁夏·朝鲜·播州）皆胜","三十年不上朝、党争激烈","<b>努尔哈赤崛起、后金建立</b>"],
  pros:["前期张居正改革，国力达到晚明顶峰","万历三大征皆胜，援朝抗倭扬威东亚","在位最长，前期政局稳定、经济繁荣"],
  cons:["国本之争僵持、后期三十年怠政","矿监税使横征暴敛，民怨沸腾","党争激化、边备废弛，后金坐大（萨尔浒之败）"],
  link:{t:"normal",l:"传位长子"}},
 {n:14,era:5,name:"朱常洛",temple:"明光宗",years:"泰昌 1620",

  tags:["在位仅一个月","红丸案"],pts:["明末三大案之「<b>红丸案</b>」暴毙","即位即病、纵欲伤身","短暂在位，党争进一步激化"],
  pros:["即位初发银犒军、罢矿税，有恤民之意","身处国本之争而不失储位，隐忍多年"],

  link:{t:"normal",l:"传位长子"}},
 {n:15,era:5,name:"朱由校",temple:"明熹宗",years:"天启 1620–1627",

  bio:"朱常洛长子，即位后改元天启。痴迷木工，人称「木匠皇帝」，疏于朝政。宦官魏忠贤与乳母客氏勾结，阉党专权达到顶峰，残酷迫害东林党人。辽东战局靠孙承宗、袁崇焕苦撑。无子，传位其弟朱由检。",
  tags:["木匠皇帝"],tp:true,tpLabel:"⚡ 阉党乱政 + 天灾",pts:["疏于朝政、痴迷木工，「木匠皇帝」","<b>阉党巅峰</b>：魏忠贤专权、迫害东林党","辽东战局恶化、熊廷弼冤死","无子，传位弟弟"],
  pros:["任凭朝政败坏，但东林—阉党间尚有一线人才支撑辽东"],
  cons:["痴迷木工、不理朝政，皇权旁落","魏忠贤、客氏专权，阉党迫害东林六君子","冤杀辽东经略熊廷弼，自毁长城","天灾频仍（王恭厂大爆炸），国势急转直下"],
  link:{t:"sib",l:"无子 · 传位弟弟"}},
 {n:16,era:5,name:"朱由检",temple:"明思宗",years:"崇祯 1627–1644",

  tags:["勤政","多疑"],pts:["开局铲除阉党、勤政节俭","内：天灾、瘟疫、农民起义蜂起","外：后金（清）入寇、松锦失守","<b>1644 煤山自缢</b>，明亡"],
  pros:["铲除阉党、勤于政事、自奉节俭","明知不可为而为之，殉国守节「君王死社稷」"],
  cons:["刚愎多疑、频繁换相（十七年五十相）","中反间计冤杀袁崇焕，自坏长城","内外交困下无力回天，终致亡国（非亡国之君，而当亡国之运）"],

  ],
  flow:"朱常洛苦熬国本之争近二十年方即位，却纵欲致病、服<b>李可灼</b>「红丸」暴毙。围绕其死，<b>梃击案、红丸案、移宫案</b>接连爆发，<b>郑贵妃、李选侍</b>牵涉其中，<b>东林党</b>借机攻讦、党争愈演愈烈，成为晚明政治崩坏的重要引信。"},

 15:{title:"天启朝 · 阉党专权",sub:"魏忠贤专权迫害东林，辽东靠名将苦撑。",
  groups:[

     {n:"魏忠贤",r:"「九千岁」·专权",d:"司礼监秉笔太监，结客氏、遍置党羽，专权乱政，生祠遍天下。"},
     {n:"客氏",r:"熹宗乳母",d:"与魏忠贤勾结，把持内廷。"},

   {g:"东林六君子",color:"#3a6b6b",members:[

     {n:"左光斗",r:"东林·直臣",d:"与杨涟同下诏狱，受酷刑而死。"},
     {n:"魏大中·顾大章等",r:"东林志士",d:"「东林六君子」相继被害于狱中。"},

     {n:"袁崇焕",r:"宁远守将",d:"宁远大捷，以红夷大炮重创努尔哈赤（努尔哈赤不久病卒）。"},
   ]},
  ],
  flow:"熹宗痴迷木工、不理朝政，<b>魏忠贤</b>结乳母<b>客氏</b>专权，号称「九千岁」，生祠遍天下，残酷迫害<b>东林六君子</b>（杨涟、左光斗等）。辽东全靠<b>熊廷弼、孙承宗、袁崇焕</b>苦撑，然熊廷弼竟因党争被冤杀。熹宗无子，传位其弟朱由检（崇祯）。"},

  groups:[

     {n:"袁崇焕",r:"蓟辽督师",d:"宁远大捷、宁锦大捷；后中皇太极反间计，被崇祯冤杀。"},
     {n:"孙承宗",r:"蓟辽督师",d:"关宁锦防线缔造者，晚年守高阳、城破殉国。"},

     {n:"孙传庭",r:"陕西总督",d:"「传庭死而明亡」，潼关战殁，李自成遂入关中。"},
     {n:"曹文诏·洪承畴",r:"边将",d:"曹文诏战殁；洪承畴松锦兵败被俘降清。"},
   ]},
   {g:"农民军领袖",color:"#a8322a",members:[
     {n:"李自成",r:"大顺·闯王",d:"1644年建大顺、破北京，崇祯自缢，后败于清军。"},
     {n:"张献忠",r:"大西·八大王",d:"转战南北，后入川建大西政权。"},
   ]},
   {g:"后金（清）",color:"#7d6a4f",members:[
     {n:"皇太极",r:"清帝·反间",d:"改后金为清，绕道入塞，用反间计诱崇祯杀袁崇焕。"},
     {n:"多尔衮",r:"摄政王",d:"1644年入关、定鼎北京，开启清朝大一统。"},
   ]},
   {g:"内廷",color:"#7d1f1a",members:[
     {n:"魏忠贤",r:"阉党·被除",d:"崇祯即位后即遭铲除，自缢而死。"},
     {n:"王承恩",r:"太监·陪殉",d:"煤山之上陪崇祯一同自缢。"},
   ]},
  ],
  flow:"崇祯铲除阉党、勤政节俭，然刚愎多疑、频繁换相。对外，<b>皇太极</b>用反间计使其冤杀<b>袁崇焕</b>，长城自坏；对内，<b>李自成、张献忠</b>流寇蜂起，<b>卢象升、孙传庭</b>等名将相继战死，<b>洪承畴</b>兵败降清。1644年李自成破北京，崇祯于煤山自缢，<b>王承恩</b>陪殉——「君非亡国之君，而当亡国之运」。"},
};
// 把明转成 periods 结构（附 emp 供点击弹层）
DYN.find(d=>d.id==="ming").periods = MING_ERAS.map((e,idx)=>({name:e.name, sub:e.sub, nodes:MING_EMP.filter(x=>x.era===idx).map(x=>({...x,emp:x.n}))}));

/* ================= 渲染 ================= */
const tabsEl=document.getElementById('tabs'), subnav=document.getElementById('subnav'), panels=document.getElementById('panels');
const periodIndex={}; // dynId -> [{name,anchor}]

function cardHTML(sym,node){
  const clickable = node.emp!=null;
  let h=`<div class="card ${node.tp?'tp':''} ${clickable?'clickable':''}" data-n="${sym}"${clickable?` data-emp="${node.emp}"`:''}>`;
  if(node.tp&&node.tpLabel) h+=`<div class="tpflag">${node.tpLabel}</div>`;
  h+=`<div class="top"><span class="name">${node.name}</span>`;
  if(node.temple||node.b) h+=`<span class="temple">${node.temple||node.b}</span>`;
  if(node.years) h+=`<span class="years">${node.years}</span>`;
  h+=`</div>`;
  if(node.tags&&node.tags.length) h+=`<div class="tags">${node.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`;
  if(node.rel) h+=`<div class="rel-line">血脉：${node.rel}</div>`;
  h+=`<ul>${node.pts.map(p=>`<li>${p}</li>`).join("")}</ul>`;
  if(clickable) h+=`<div class="clickhint">点击查看 · 帝王详情与人物关系图谱 ›</div>`;
  h+=`</div>`;
  return h;
}
function connHTML(link){ return link?`<div class="conn ${link.t}"><span>${link.l}</span></div>`:""; }

/* 总览 */
let ovRows=DYN.map(d=>`<div class="ovrow" data-goto="${d.id}">
  <span class="dot" style="background:${d.full?'#a8322a':'#7d6a4f'}"></span>
  <span class="ovname">${d.name}</span>
  <span class="ovmeta"><span class="ovy">${d.years}</span><div class="ovf">${d.ov}</div></span>
  <span class="arrow">›</span></div>`).join("");
panels.innerHTML=`<section class="panel active" id="p-ov"><div class="dynhead">
  <div class="dname">朝代总览</div>
  <div class="dmeta"><span>秦 前221</span><span>→</span><span>今</span><span>两千两百余年</span></div>
  <div class="dov">点任一朝代进入其时间线；进入后顶部第二行会出现该朝的「分期导航」。「明」为完整十六帝详版。</div>
 </div><div class="ovlist">${ovRows}</div></section>`;

tabsEl.insertAdjacentHTML('beforeend',`<button class="ov active" data-tab="ov">总览</button>`);
const CN2=["一","二","三","四","五","六","七","八"];
DYN.forEach(d=>{
  let inner=`<div class="dynhead"><div class="dname">${d.name}</div>
    <div class="dmeta"><span>年代 <b>${d.years}</b></span><span>都城 <b>${d.cap}</b></span><span>国祚 <b>${d.span}</b></span></div>
    <div class="dov">${d.ov}</div></div>`;
  let tl="";
  periodIndex[d.id]=[];
  d.periods.forEach((per,pi)=>{
    const anchor=`era-${d.id}-${pi}`;
    periodIndex[d.id].push({name:per.name, anchor});
    tl+=`<div class="era" id="${anchor}"><span class="eno">${CN2[pi]||pi+1}</span><span class="ename">${per.name}</span><span class="esub">${per.sub||''}</span></div>`;
    per.nodes.forEach((node,ni)=>{ tl+=cardHTML(String(ni+1),node); });
    if(pi===d.periods.length-1 && d.to) tl+=connHTML(d.to);
  });
  inner+=`<div class="tl">${tl}</div>`;
  panels.insertAdjacentHTML('beforeend',`<section class="panel" id="p-${d.id}">${inner}</section>`);
  tabsEl.insertAdjacentHTML('beforeend',`<button data-tab="${d.id}">${d.name}</button>`);
});

let currentDyn="ov";
function setTopbarH(){
  const h=document.getElementById('topbar').offsetHeight;
  document.documentElement.style.setProperty('--topbar',(h+8)+'px');
}
function buildSubnav(id){
  if(id==='ov'||!periodIndex[id]){ subnav.classList.add('hide'); subnav.innerHTML=""; return; }
  subnav.classList.remove('hide');
  subnav.innerHTML=periodIndex[id].map((p,i)=>`<button data-anchor="${p.anchor}"><span class="sn">${CN2[i]||i+1}</span>${p.name}</button>`).join("");
  subIO.observe && observePeriods(id);
}
function activate(id){
  currentDyn=id;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));
  const p=document.getElementById('p-'+id); if(p)p.classList.add('active');
  const btn=document.querySelector(`.tabs button[data-tab="${id}"]`); if(btn)btn.scrollIntoView({inline:'center',block:'nearest'});
  buildSubnav(id);
  setTopbarH();
  // 滚到该朝头部（避免被吸顶遮住）
  const top=(p?p.getBoundingClientRect().top+window.scrollY:0)-(document.getElementById('topbar').offsetHeight)-6;
  window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
  // 高亮第一个分期
  setTimeout(()=>setActiveChip(0),60);
}
function setActiveChip(idx){
  document.querySelectorAll('.subnav button').forEach((b,i)=>b.classList.toggle('active',i===idx));
  const b=document.querySelectorAll('.subnav button')[idx]; if(b)b.scrollIntoView({inline:'center',block:'nearest'});
}

/* 点击分期导航 -> 跳转 */
subnav.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  const el=document.getElementById(b.dataset.anchor); if(!el)return;
  const top=el.getBoundingClientRect().top+window.scrollY-(document.getElementById('topbar').offsetHeight)-4;
  window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
});
tabsEl.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b)activate(b.dataset.tab); });
panels.addEventListener('click',e=>{ const r=e.target.closest('.ovrow'); if(r&&r.dataset.goto)activate(r.dataset.goto); });

/* ===== 帝王详情 / 人物关系图 弹层 ===== */
const overlay=document.getElementById('overlay'), sheetBody=document.getElementById('sheet-body');
function openEmp(n){
  const e=MING_EMP.find(x=>x.n===n); if(!e)return;
  const f=MING_FIGS[n]||{groups:[],flow:''};
  document.getElementById('sh-name').textContent=e.temple+' · '+e.name;
  document.getElementById('sh-temple').textContent=e.years;
  let h='<div class="dossier">';
  h+=`<div class="sec"><div class="sec-h"><span class="ico">生</span>帝王生平</div><div class="bio">${e.bio||''}</div></div>`;
  h+=`<div class="sec"><div class="sec-h"><span class="ico">脉</span>血缘与继承</div><div class="relbox">${e.rel||''}</div></div>`;
  h+=`<div class="sec"><div class="sec-h"><span class="ico">政</span>主要政绩与事件</div><ul>${e.pts.map(p=>`<li>${p}</li>`).join('')}</ul></div>`;
  h+=`<div class="sec"><div class="sec-h"><span class="ico">评</span>正面评价 · 争议点</div><div class="proscons">`;
  h+=`<div class="pc plus"><h4>✓ 正面评价</h4><ul>${(e.pros||[]).map(p=>`<li>${p}</li>`).join('')}</ul></div>`;
  h+=`<div class="pc minus"><h4>✕ 争议点</h4><ul>${(e.cons||[]).map(p=>`<li>${p}</li>`).join('')}</ul></div>`;
  h+=`</div></div></div>`;
  if(f.groups&&f.groups.length){
    h+=`<div class="figmap"><div class="map-h"><span class="ico">图</span>${f.title||'主要人物关系图谱'}</div>`;
    if(f.sub)h+=`<div class="map-sub">${f.sub}</div>`;
    f.groups.forEach(g=>{
      h+=`<div class="figgroup"><div class="gname" style="background:${g.color||'#a8322a'}">${g.g}</div><div class="figcards">`;
      g.members.forEach(m=>{ h+=`<div class="figcard"><span class="fn">${m.n}</span><span class="fr">${m.r}</span><div class="fd">${m.d}</div></div>`; });
      h+=`</div></div>`;
    });
    if(f.flow)h+=`<div class="figflow"><span class="fh">🔗 关系脉络</span>${f.flow}</div>`;
    h+=`</div>`;
  }
  sheetBody.innerHTML=h;
  overlay.classList.add('show');
  document.body.style.overflow='hidden';
  overlay.scrollTop=0;
}
function closeEmp(){ overlay.classList.remove('show'); document.body.style.overflow=''; }
document.getElementById('sh-close').addEventListener('click',closeEmp);
overlay.addEventListener('click',ev=>{ if(ev.target===overlay)closeEmp(); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape')closeEmp(); });
panels.addEventListener('click',ev=>{ const c=ev.target.closest('.card.clickable'); if(c)openEmp(+c.dataset.emp); });

/* 滚动时高亮当前分期 */
let io=null;
function observePeriods(id){
  if(io)io.disconnect();
  const eras=[...document.querySelectorAll(`#p-${id} .era`)];
  io=new IntersectionObserver(entries=>{
    // 取当前最靠上、可见的期
    const vis=entries.filter(e=>e.isIntersecting);
    if(vis.length){
      const topOne=vis.reduce((a,b)=>a.boundingClientRect.top<b.boundingClientRect.top?a:b);
      const idx=eras.indexOf(topOne.target);
      if(idx>=0)setActiveChip(idx);
    }
  },{rootMargin:'-'+Math.round(document.getElementById('topbar').offsetHeight+10)+'px 0px -65% 0px',threshold:0});
  eras.forEach(el=>io.observe(el));
}
const subIO={observe:true}; // 占位

window.addEventListener('resize',()=>{ setTopbarH(); });
setTopbarH();
// hash 直达
if(location.hash){ const h=location.hash.slice(1); if(document.getElementById('p-'+h)) activate(h); else if(h==='ov')activate('ov'); }
</script>
</body>
</html>
